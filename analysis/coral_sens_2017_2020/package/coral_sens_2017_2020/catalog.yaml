# catalog.yaml -- coral package facts (SPEC_TABLE_MODE.md 1.3-1.5). GENERATED 2026-10-19 by
# D:/treeroute/coral_build/coral_tables/make_draft.py from columns.py. The target's facts were then signed by the
# owner 2026-10-20 (ruling X) through make_signed_coral.py, so this file is no longer the generator's output:
# never re-run make_draft.py on this package (it rewrites this file and ban.yaml and would lose the signatures).
# Every written column of every lead file is declared here (closed world on columns, T-COLUMNS). A role is not a
# verdict: the verdicts are in ban.yaml. No store catalog: in a table the engine computes no lag (ruling U1), so the
# timing of each feature is in its 'provenance' text and the owner vouches for it (ruling U2, AUDIT_CHECKLIST.md B).
# Words in the provenance texts: T target date, A feature anchor (= T, or the month's first day for a month-precision
# visit), L lead in days, C = A - L the feature cut; every data value used is dated strictly before C, and C is never
# later than the issue date T - L.
# The target window is one day, stamp event_date: T is the label's last content day (SPEC_TABLE_MODE.md 1.3, 1.5).
# For a month-precision visit T is the month's last day, so the label is surely known after T, and its features end
# before the month starts (A). fact_status is 'unverified' (the schema default) on every column except the
# target pct_bleached, whose facts the owner signed 2026-10-20 (verified, reviewed_by owner).
columns:
  row_id:
    role: key_row
    provenance: '''<unit_id>|<T as YYYY-MM-DD>''; the same id is the same visit in every lead file'
  unit_id:
    role: key_unit
    provenance: '''<GCBD ecoregion id, 3 digits>_<lat>_<lon>'' with lat/lon at 4 decimals from coral_safe.site_key (coral_safe.py:97-107)'
  group:
    role: key_group
    provenance: ecoregion NAME from GCBD Ecoregion_Name_LUT (Site_Info_tbl.Ecoregion_Name is its integer key)
  lat:
    role: key_lat
    provenance: site latitude rebuilt from the 4-decimal site key (EPSG:4326)
  lon:
    role: key_lon
    provenance: site longitude rebuilt from the 4-decimal site key (EPSG:4326)
  target_date:
    role: key_time
    calendar_part: date
    provenance: 'T: GCBD Sample_Event_tbl Date_Year/Month/Day (not events_dated.date, which clamps the day at 28, CORAL_STATE.md:148-151); month-precision visits (Donner or Safaie with day 15, CORAL_DATA_AUDIT.md:65-69) take the month''s last day'
  issue_date:
    role: key_issue
    provenance: T - L days, exactly (T-ISSUE)
  feature_end:
    role: key_feature_end
    provenance: 'the last content day any feature window of the row may read at this lead (a window bound computed before any data is read, P24): the largest of the SST window end (C - g - 1), the cyclone window end (C - g - 1) and each index month''s last content day (month end + reach: +2 months nino34a, +1 month dmi). g = --sst-gap-days (default 1; UTC source days vs local survey dates). Always before the issue date (T-FEATEND); build_tables.py asserts every value read is on or before it'
  mark:
    role: key_mark
    provenance: '''train'' when T is before 1 January of the first test year; ''test'' inside the test years (package parameter, default 2016-2019); later visits are not written'
  pct_bleached:
    role: target
    legal_range:
    - 0
    - 100
    legal_range_source: 'percent of colonies (Reef Check: of the 4 transect segments, each a percentage, averaged) bleached: a percentage by the survey protocols (GCBD Bleaching_tbl Percent_Bleached and S1-S4; coral_smoke_regress.py:9-14); values outside [0, 100] are dropped by the recipe (coral_smoke_regress.py:73)'
    window:
      length: 1
      unit: day
      align: backward
    stamp: event_date
    fact_status: verified
    reviewed_by: owner
    date: '2026-10-20'
    provenance: 'percent of coral bleached per visit: Reef_Check Population rows (level 1) -> mean of S1..S4; AGRRA, FRRP, McClanahan, Donner -> Percent_Bleached; Kumagai and Safaie excluded (ordinal only); mean per Sample_ID, then mean over the Sample_IDs of one visit (unit, T); rows outside [0, 100] dropped (coral_smoke_regress.py:65-76); facts signed by the owner 2026-10-20 (verified, ruling X, OWNER_RULINGS_2026-10-06.md)'
  programme:
    role: report_stratum
    provenance: GCBD Data_Source_LUT via Site_Info_tbl.Data_Source; 'mixed' when one visit merges Sample_IDs of two programmes
  ctx_month:
    role: router_context
    provenance: 'calendar month of C (H3: the issue step; legacy read the TRUE date, coral_forecast.py:121)'
  ctx_doy_sin:
    role: router_context
    provenance: sin(2 pi dayofyear(C) / 365.25)
  ctx_doy_cos:
    role: router_context
    provenance: cos(2 pi dayofyear(C) / 365.25)
  ctx_abslat:
    role: router_context
    provenance: '|lat| of the site (static, a physical location)'
  ctx_mmm:
    role: router_context
    provenance: 'MMM(C) = coral_dhw_model.mmm_from (coral_dhw_model.py:69-93) on the SST values before C: per calendar month a linear trend of the monthly means, read at epoch 1988.2857; the largest month; needs 365 values and 10 distinct years; every SST value used is dated strictly before C = A - L (coral_forecast.py:110: searchsorted ''left'')'
  dhw_30:
    role: engineered
