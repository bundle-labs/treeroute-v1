# Conventions (APP_PLAN 1.3): the row key names a calendar month (or a calendar year for annual values).
#   plain window    -> stamp period_end   + window {length, unit, align: backward}
#   centred window  -> stamp period_centre + window {length, unit, align: centred}
#   unknown window  -> stamp period_centre + window {unit, align: unknown} (no length until a max_length is signed)
#   reach past the period edge (no schema field for it) -> a WIDER window that ends at or after the content's
#   end; R8 reads only the forward edge, so the wider start never changes a lag.
#   static column   -> cadence {kind: static}, no window; stamp period_end is a placeholder the schema requires.
# index_facts.yaml (the F10/V11 audit) writes EVERY window as period_centre + centred; both describe the same
# content. Its proposals are not merged here: M1 merges them by hand once signed.
