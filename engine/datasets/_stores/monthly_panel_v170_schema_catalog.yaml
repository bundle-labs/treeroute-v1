# Conventions (APP_PLAN 1.3): the row key names a calendar month (or a calendar year for annual values).
#   plain window    -> stamp period_end   + window {length, unit, align: backward}
#   centred window  -> stamp period_centre + window {length, unit, align: centred}
#   unknown window  -> stamp period_centre + window {unit, align: unknown} (no length until a max_length is signed)
#   reach past the period edge (no schema field for it) -> a WIDER window that ends at or after the content's
#   end; R8 reads only the forward edge, so the wider start never changes a lag.
#   static column   -> cadence {kind: static}, no window; stamp period_end is a placeholder the schema requires.
# index_facts.yaml (the F10/V11 audit) writes EVERY window as period_centre + centred; both describe the same
# content. Its proposals are not merged here: M1 merges them by hand once signed.
# MERGED 2026-09-28 (catalogs task; nothing signed, the owner signs timing facts by Sat 10 Oct): the ruled timing
# facts of OWNER_RULINGS_2026-09-28.md part B (R-A a, R-B, R-C a, item 8 a) and part F item F4, taken from
# index_facts.yaml / INDEX_WINDOW_AUDIT.md, in the audit's spelling (stamp period_centre + centred window):
#   nino12, nino3, nino4, nino34 and the 8 sst_anom_*: {1, month, centred} + reach_after_max {2, month}   (R-A a; F4)
#   oni: {3, month, centred} + reach_after_max {2, month}                                          (R-A a)
#   tni: {7, month, centred}, fact_status assumed                                                   (R-B)
#   co2: {3, month, centred}, fact_status assumed                                                   (R-C a; F4)
#   V11_mean_ndvi, V12_mean_evi: {1, month, centred} + reach_after_max / reach_before_max {15, day}  (item 8 a)
# The schema now HAS reach_after_max / reach_before_max (ruling B item 8 a), so the 'WIDER window' convention above
# applies only to the columns seeded before the ruling (albedo, GPP, MOD44B, ...), which are unchanged. A re-run of
# engine/datasets/_tools/export_review_csv_v2.py would revert these 15 + 2 columns: re-merge after any re-seed.
# MERGED 2026-10-05 (PM2.5 ban-list task, OWNER_RULINGS_2026-10-05.md section J; nothing signed). Each changed column
# is fact_status 'assumed', and that covers ONLY the facts named here: the store schema's window has no fact_status of
# its own, so the column carries it, and each column's provenance names its assumed facts (the rest stay as seeded):
#   nitrogen_gkg: units cg kg-1, legal_range [0, 5000]                                               (J4)
#   V30_soil_moisture_pct: legal_range [-1e-12, 100] (float rounding of 0)                           (J4)
#   deeprec_twsa: reach_after_max {3, month} -> lag 3 on a monthly target                            (J2 b)
#   phenology_sos_doy: {1, year, centred} + reach_after_max {1, year} -> lag 2 years monthly, 1 annual (J2 b)
#   aglw_* (6): the seed's facts (fact_status unverified, no content_epoch); only the provenance text is new: it
#     states the 2022-23 extension defect. A content_epoch '2002/2021' written for the FIRST J3 text (freeze) was
#     removed in the fix round: the AMENDED J3 (same file) makes aglw_* a lagged annual driver on all four packages,
#     R8 lags the seeded window {1, year, backward} to year-1 on a monthly target, and the epoch was beyond this
#     task's J4 / J2 b store scope.
#   NOT written, so G-LAG refuses each one LOUDLY until the owner signs a window: noi's J1 bound ({3, month,
#     centred}, assumed; review/proposed/BAN_REVIEW_SUMMARY.md 5 B and Q2), epo (kept by J2 d, but no ruling sets
#     its window; proposed {1, month, centred} like its CPC siblings nao/pna/wp) and the 10 other unknown index
#     windows (soi, tna, tsa, iod, ao, nao, pna, wp, sam, pdo). They go in one merge after the owner signs: noi alone
#     unblocks no package's R8, and the fire, NDVI, defo and draft tests pin it as refused with the others.
#     gfed_burn_schema_catalog.yaml burn_frac DOES carry J1's assumed reach_after_max {1, month}: the difference is
#     on purpose. An unwritten index window is a loud refusal; an unwritten burn_frac reach would let the column in
#     at lag 0, a SILENT one-month look-ahead (MCD64A1 labels month m from month m+1 observations; ruling R-D b).
# A re-seed would revert these too: re-merge them after any re-seed.
# SIGNED 2026-10-06 (ruling L1, OWNER_RULINGS_2026-10-05.md section L, "Yes to all"). The ruling says "fact_status signed,
# reviewed_by owner, 2026-10-06"; the schema (treeroute/package/schema.py FactStatus) has no 'signed' value, so a signed
