# defo_annual_features -- STORE catalog in the engine schema (treeroute.package.schema.StoreCatalog) for the defo
# package's FEATURES store: the annual <parent>_mean / _min / _max columns that its feature script
# (features/build.py, not written yet) builds from the monthly panel with aggregate_time (plan 1.5). Ruling C
# 'Defo store' (OWNER_RULINGS_2026-09-28.md): "Rebuild defo's yearly columns from the monthly panel with the
# package's feature script (aggregate_time). Do not read D:/defo_matrix's target copy, train/test flag or
# pre-lagged columns." Written 2026-09-28 by the catalogs task; every fact 'unverified' (tni / co2 aggregates 'assumed', as their parents); nothing signed.
#
# Columns: one per (monthly parent, stat) for the 101 defo catalog drivers whose panel cadence is {regular, 1, month}
# (303 columns). Annual and static panel columns are already at or above the target's step and are read as they are.
# Names follow defo_matrix.py:21-25 / 156-166 (annualise). Plan 1.4 family expansion lets a VERDICT declared on
# the parent's family expand to these aggregates. It carries verdicts only: the package fact
# co_measured_with_target (plan 1.3, no default) is not a verdict, and defo/catalog.yaml gives these names no
# answer yet. Six parents that the shipped run read only lagged (defo_ban.py LAG) come out at lag 0 year as
# aggregates, so their answers decide whether same-year post-event state enters: OPEN item in defo/catalog.yaml.
# DO NOT write verdicts for these names while defo/dataset.yaml still declares D:/defo_matrix as the driver store:
#   the names equal the matrix's shipped aggregate columns, which were built with the panel's NoData sentinels
#   inside and without the D34 missing-month rule, so a verdict would bind the shipped values, not this rebuild.
#   Switch dataset.yaml to the panel plus the features store (with this include) first.
# Facts per column:
#   derived_from [parent]; operation 'aggregate_time {window: 1 year, stat: mean|min|max}' (plan 1.5 spelling: the
#     calendar year, the target's step, no season months); reads_target false.
#   As treeroute/io/aggregate.py (F5 body) builds an aggregate's facts: dtype float64, fill_values none (the output
#     holds NaN, never a code), cadence the target's, derived_from the source; EVERY OTHER FACT INHERITED from the
#     parent (plan 1.5: units, legal range for mean/min/max, lineage, product family; also scope, baseline_period,
#     observed_through and fact_status, so the tni / co2 aggregates are 'assumed' like their parents). Copied
#     here because the schema requires the physical facts in a store catalog.
#   cadence {regular, 1, year}; stamp period_end = the aggregate path's fixed stamp (timing.aggregate_window,
#     AGGREGATE_STAMP), written because the schema requires a stamp.
#   NO window: an aggregate's window is COMPUTED from the aggregation span, never typed (plan 1.5). Ruling F5:
#     aggregate_time builds it with timing.aggregate_reach / timing.aggregate_window from the parent's facts, so
#     the ruled 1-year annual lags survive aggregation (nino12/3/4/34, oni, the 8 sst_anom_*, tni, co2, V11, V12:
#     December's content reaches past the year end; also V14_mean_albedo and gpp_kgC_m2, whose seeded 47-day
#     centred windows reach past December). Until the feature runner writes it, R8 refuses these columns
#     (no window fact), by design. tests/test_catalog_timing_facts.py computes it from the parents' facts today.
#   operation: the declaration above REPLACES the parent's (six parents are themselves derived: wbal_*, eddi_observed).
#   None of the 101 parents has a sum group, absent groups, content_epoch or a 2^30 opt-out.
# Missing months: D34 (strict, accepted default) makes a unit-year with any missing month NaN. epo is NaN every
#   December (INDEX_WINDOW_AUDIT.md T2), so its three aggregates are NaN in every year (R30 will flag them); amo is
#   NaN from February 2023 and the SPEI columns after 2022-12 (observed_through), so their 2023 aggregates are NaN.
# NOT YET WIRED: defo/dataset.yaml (outside the catalogs task's write scope) declares neither a features store path
#   nor this include. Proposed path, the plan 1.1 default layout for new data:
#   data/features/group={group}/year={year}/part-0.parquet (a NEW folder inside the package, never an existing store).
store: defo_annual_features
description: 'Engineered annual columns of the defo package: <parent>_mean/_min/_max of 101 monthly panel columns over
  each calendar year, built by the package feature script with aggregate_time (plan 1.5; ruling C). Features store
  path not declared yet in dataset.yaml (proposed: data/features/group={group}/year={year}/part-0.parquet). Written
  2026-09-28; every fact unverified or, as its parent, assumed.'
columns:
  V01_mean_temp_C_mean:
    dtype: float64
    units: 'degC'
    cadence:
      kind: regular
      length: 1
      unit: year
    scope: unit
    stamp: period_end
    legal_range:
    - -90.0
    - 60.0
    fill_values: []
    product_family: 'TerraClimate'
    derived_from:
    - V01_mean_temp_C
    operation: 'aggregate_time {window: 1 year, stat: mean}'
    reads_target: false
    fact_status: unverified
    provenance: 'mean of the monthly panel column V01_mean_temp_C over each calendar year (plan 1.5 aggregate_time; ruling C); shipped equivalent defo_matrix.py:156-166 (annualise)'
