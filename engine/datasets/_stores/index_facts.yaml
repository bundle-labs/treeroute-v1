      The ENSO columns and the sst_anom_* boxes are ERSSTv5 [T5, T6]. Providers moved to ERSSTv6 in 2026
      (PSL timeseries pages; CPC ONI v6 page). The 2-month filter revision is NOT v6-only: CPC's v5 ONI page
