        written_by: presplit_cc/ingest_noaa_indices.py
        snapshot_date: "2026-06-16"
        snapshot_date_basis: file modification time (the download date is not logged)
        panel_equals_source: true   # [T2], all 264 months, 19 columns
      ersst_boxes:
        path: "C:/Users/<user>/Downloads/desertflow/desertflow_bundle_global/ersst_sst_boxes_monthly.parquet"
