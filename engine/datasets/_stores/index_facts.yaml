    cadence: {length: 1, unit: month}
    content_epoch: {first: "2002-01", last: "2023-12"}
    source_tables:
      noaa_indices:
        path: "C:/Users/<user>/Downloads/desertflow/desertflow_bundle_global/noaa_indices_monthly.parquet"
