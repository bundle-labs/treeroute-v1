  monthly_panel_unit_columns:
    # Unit-scoped panel columns whose window was audited because R17 (NDVI target) and R8 (V11/V12 as
    # drivers) need it.
    columns:
      V11_mean_ndvi:
        units: "1"
        product_family: MODIS_VI
        provider: NASA LP DAAC
        product: "MOD13C2.061 'CMG 0.05 Deg Monthly NDVI' (from MOD13C1/MOD13A2 16-day composites)"
        ingest_ref: "presplit_cc/ingest_modis_cmg_local.py:56-60, 143-166; presplit_cc/assemble_monthly_panel.py:49"
        stamp: period_centre       # granule matched by acquisition month A<YYYYDDD> (ingest_modis_cmg_local.py:143-166)
        running_mean: "weighted average of every 16-day composite that overlaps the calendar month, weight = overlap"
        window:
          length: 1
          unit: month
          align: centred
          reach_after_max: {value: 15, unit: day}    # SCHEMA PROPOSAL; per month: Jan 1, Feb 4-5, ..., Sep 14-15, Oct 0 (15 leap), Nov 1-2, Dec 2-3 [T9]
          reach_before_max: {value: 15, unit: day}   # SCHEMA PROPOSAL
          # December: the DOY-353 16-day composite runs to 3 January (2 January in leap years) -- NASA CMR
          # granule time ranges [S42]: MOD13C1.A2019353 2019-12-19..2020-01-03, MOD13C1.A2020353 2020-12-18..2021-01-02.
          # So a calendar-year aggregate of V11 reaches 2-3 days past the year end.
        window_fallbacks_in_current_schema:
          - {window: {length: 3, unit: month, align: centred}, tradeoff: "safe for R17 and as a driver; as a TARGET window it moves R8's reference to the end of t+1 (too loose)"}
          - {window: {length: 61, unit: day, align: centred}, tradeoff: "close to exact; overstates February's reach (17 vs at most 5 days)"}
        legal_range_documented: {min: -0.2, max: 1.0, source: "MOD13 User Guide V6.1 Table 19: valid range -2000..10000, scale 0.0001"}
        baseline_period: none      # an absolute index, not an anomaly
        fact_status: unverified
        proposed_status: verified      # overlap weighting documented (S38 7.1, 9.1); 16-day calendar (starts DOY 1, 17, ..., 353; full 16 days across 1 January) confirmed from CMR granule time ranges [S42]
        reviewed_by: null
        date: null
        evidence: [user_guide_S38, product_page_S38, cmr_granule_time_ranges_S42, composite_calendar_T9]
        lineage_note: "Pixel reliability rank 4 = 'Estimated: from MODIS historic time series' (climatology fill); see ingest_modis_cmg_local.py:62-73."
        source_file: "MOD13C2.061 granules, band 'CMG 0.05 Deg Monthly NDVI', per-cell table in D:/modis_ndvi_cmg (ingest_modis_cmg_local.py:56-60)"
        # R8 as a DRIVER, monthly target: 1 (reaches into the next month) | R8 annual (calendar-year aggregate): 1
        #   (December reaches 2-3 days into January [S42]; defo already lags V11, defo_ban.py:130)
        # R17 as the TARGET: history block starts one step back (t-2 at the nowcast)
      V12_mean_evi:
        units: "1"
        product_family: MODIS_VI
        provider: NASA LP DAAC
        product: "MOD13C2.061 'CMG 0.05 Deg Monthly EVI' (sibling band of V11 in the same file)"
        ingest_ref: "presplit_cc/ingest_modis_cmg_local.py:75-80"
        stamp: period_centre
        running_mean: "as V11_mean_ndvi"
        window:
          length: 1
          unit: month
          align: centred
          reach_after_max: {value: 15, unit: day}    # SCHEMA PROPOSAL
          reach_before_max: {value: 15, unit: day}   # SCHEMA PROPOSAL
        baseline_period: none
        fact_status: unverified
        proposed_status: verified
        reviewed_by: null
        date: null
        evidence: [user_guide_S38, cmr_granule_time_ranges_S42, composite_calendar_T9]
        source_file: "MOD13C2.061 granules, band 'CMG 0.05 Deg Monthly EVI', per-cell table in D:/modis_evi_cmg (ingest_modis_cmg_local.py:75-80)"
        # R8 as a DRIVER, monthly target: 1 | R8 annual: 1 (December reaches 2-3 days into January, as V11)

