# index_facts.yaml -- PROPOSED catalog facts from the F10 index-window audit and the target-window audit.
# Written 2026-09-28 by the index-audit task; revised the same day after review. NOTHING HERE IS SIGNED.
# Evidence and sources: INDEX_WINDOW_AUDIT.md in this folder ([S..] = provider page or repo file,
# [T..] = read-only data test).
#
# THIS FILE IS A PROPOSAL, NOT A STORE CATALOG. The M1 catalog loader must NOT glob it (it shares the
# folder with the seeded store catalogs). At M1 its entries are merged by hand: store facts into the one
# catalog per store (e.g. monthly_panel_v170.yaml), target facts into each package's catalog.yaml.
# Keys outside APP_PLAN 1.3 (running_mean, evidence, owner_options, notes, product, provider, source_file,
# ingest_ref, not_global, window_fallbacks_in_current_schema, window_if_*, legal_range_documented,
# lineage_note, proposed_status) are review aids; drop or map them at the merge.
# EVERY fact_status here is 'unverified'. proposed_status is the auditor's proposal only; fact_status may
# change only when the owner signs (reviewed_by + date filled in).
#
# Field meanings follow APP_PLAN.md 1.3 (store facts) and, for the targets block, the package facts
# "target window and stamp". Roles are NOT written here (a role in a store catalog is refused, 1.3).
#
# Conventions
#   stamp: period_centre  -- a (year, month) key names the CENTRE of that calendar month; a (year) key
#                            names the centre of that calendar year.
#   window                -- the span of CONTENT time that can enter the stamped value, around the stamp.
#                            {length: 1, unit: month, align: centred} is exactly the calendar month.
#   running_mean          -- the provider's own smoothing of the monthly value (none = not smoothed).
#   fact_status           -- always 'unverified' in this file (APP_PLAN 1.2: catalog facts start unverified).
#   proposed_status       -- the auditor's proposal. verified: a provider page or repo code states it AND,
#                            where a test was possible, the panel values agree. assumed: a bound or choice
#                            the owner must sign (G-FACTS). pending_owner_ruling: the fact itself depends
#                            on a ruling listed under pending_rulings (the window given is the one that
#                            holds if the ruling goes the "disclose" way; window_if_* gives the other).
#                            A value 'unknown' inside a fact = could not be verified.
#   reviewed_by, date     -- left null for the owner (APP_PLAN 1.3).
#   No lag is written as a fact (G-LAG, G-NOKNOB: a verdict never types a number). The R8 lag each fact
#   implies is given in a COMMENT only, for review:
#     "R8 monthly" = lag on a monthly target (nowcast: behind the target month; at lead L: behind the
#                    issue month -- the same number).
#     "R8 annual"  = lag on an annual target built from calendar-year aggregates (aggregate_time).

meta:
  audit: F10 index-window audit + target-window audit (R8, R17)
  written: 2026-09-28
  revised: "2026-09-28 (review fixes: ERSSTv5 filter ruling, tni alignment, MOD13 year-end reach, fire detection window, statuses)"
  status: proposed_unsigned
  merged: >-
    2026-09-28 (catalogs task): the owner's rulings R-A (a), R-B, R-C (a), R-D (b), item 8 (a) and F4
    (OWNER_RULINGS_2026-09-28.md parts B and F) are merged, every fact still unverified or assumed (the owner signs
    timing facts by Sat 10 Oct). Store facts went into monthly_panel_v170_schema_catalog.yaml (nino12, nino3, nino4,
    nino34, oni, tni, co2, the 8 sst_anom_*, V11_mean_ndvi, V12_mean_evi); target facts into ../fire/catalog.yaml
    (reach_after_max, a proposed 1-month bound, unverified until signed) and ../ndvi/catalog.yaml. R-E (PSL
    footers) is authorised but not done, so the unknown base periods here are unchanged. The pending_rulings text
    below is kept as the record of what was asked; the catalogs, not this file, hold the facts the engine reads.
  not_a_store_catalog: true   # the M1 loader must skip this file (see header)
  plan_refs: ["APP_PLAN.md 1.3", "APP_PLAN.md R1", "APP_PLAN.md R8", "APP_PLAN.md R17", "G-LAG", "G-FACTS", "Q2", "Q43 a"]
  report: INDEX_WINDOW_AUDIT.md
  schema_proposals:
    - "window.reach_after_max / window.reach_before_max (days or months) for values whose content crosses the step edge (V11 composites; ERSSTv5 filter under ruling R-A option a); see audit open item 6"
    - "running_mean kept beside window for readability; it is implied by window and may be dropped"
  pending_rulings:   # owner decisions that change facts in this file; details in INDEX_WINDOW_AUDIT.md
    R-A_ersstv5_filter: >-
      CPC (ONI v5 and v6 pages): "Because of the high frequency filter applied to the ERSSTv5 data ... ONI
      values may change up to two months after the initial real-time value is posted." A value that changes
      later because of a filter contains later data, i.e. content up to 2 months after its month. Applies to
      the 13 ERSSTv5 columns: nino12, nino3, nino4, nino34, oni and the 8 sst_anom_* boxes.
      (a) rule it CONTENT: reach +2 months -> R8 monthly lag 2 (nino*, sst_anom_*), 3 (oni); annual lag 1 year for all 13.
      (b) rule it a disclosed input-analysis property like a base period -> lags as without it (0; oni 1).
      Q43 a covers base periods only, so (b) needs an explicit new ruling.
    R-B_tni_alignment: >-
      Provider states only the 5-month length. Data rule out alignments giving lag 0-1 but cannot separate
      centred (lag 2) from one month later (lag 3). Sign one: centred as verified-from-data (lag 2);
      'centred or later' bound {7, month, centred} (lag 3); or align unknown, max_length 5 (lag 4).
    R-C_co2_bound: "sign window {3, month, centred} as assumed (lag 1; annual 1) or a plain month (lag 0)."
    R-D_fire_detection_window: >-
      MCD64A1 labels month m burned/unburned using observations past the month end (User Guide V6.1 3.1.2).
      (a) sign the target window as one calendar month and disclose the margin (history ends t-1);
      (b) add a reach_after fact (margin not stated) -> R17 history block starts t-2, a new acceptance flag.
    R-E_psl_footers: >-
      Authorise reading the 13 PSL .data footers (read-only, nothing saved), as F10's endorsed fix says
      ("Record each index's smoothing from PSL/CPC footers"). Until then no footer is used as evidence.

