# catalog.yaml -- defo package facts (APP_PLAN.md 1.3). Drafted 2026-09-28 by the agent; rewired 2026-09-29 (ruling C
# 'Defo store'); Q34 ban list installed 2026-10-05 (owner ruling J, OWNER_RULINGS_2026-10-05.md). Unsigned.
# Every entry is a PACKAGE fact (plan 1.3): a role and, for the target, its window, stamp, legal range and error
# floor; co_measured_with_target where the owner has ruled it. Physical facts (dtype, units, cadence, windows,
# fills, lineage) live in the store catalogs dataset.yaml includes; a store fact written here is refused by the
# schema. fact_status is 'unverified' (the schema default where not written), or 'assumed' where an owner ruling sets
# the fact (K4's four land-cover rows, the six L3 aglw_*_hold2021 rows): nothing here is signed or verified, and the
# owner signs timing facts separately.
# A role is NOT a verdict: the verdicts are in ban.yaml (one per non-key column, closed world, plan 1.4).
# No router context: the region router uses none (plan 3.2).
#
# The columns (ruling C 'Defo store', option b: the yearly columns are rebuilt from the monthly panel):
#   - the keys and the target loss_frac (D:/defo_target, read through ingest/target_reader.py);
#   - forest2000_px, the Q50 report stratum (the static table D:/defo_features/static/part-0.parquet);
#   - y, land_px and is_train: columns of the retired D:/defo_matrix and of the target store, kept as rows so
#     their forced bans stay explicit (ruling C: never read);
#   - the annual and static panel drivers, read as they are from the features store D:/defo_features
#     (features/build_store.py; their store facts are the panel catalog's, the same columns);
#   - h_nbr1, h_nbr2, h_nbr_cum, h_yrs_since (built by build_store.py from the target, years <= t-1 only) and
#     h_lag1-3, h_cum (not built: replaced by the engine's history block, Q12);
#   - the 303 annual aggregates <parent>_mean/_min/_max of the 101 monthly panel columns (aggregate_time in
#     build_store.py; store facts in features/defo_features_store_catalog.yaml, generated; 264 built, 39 not);
#   - the 18 engineered lag columns <aggregate>_lag1 of owner ruling J2 (a), built by features/build.py.
#   - (owner ruling K, 2026-10-06) the 6 engineered columns of the K supplementary store D:/defo_features_k
#     (features/build_store_k.py): deeprec_twsa_k3_mean/_min/_max (K3) and the lag-2-year MOD44B trio
#     V15_bare_ground_pct_lag2, V17_herb_cover_pct_lag2, tree_cover_pct_lag2 (K5); the K store also holds epo_mean/_min/_max
#     (K2), rows already listed below with the other aggregates.
# REMOVED 2026-10-05 (owner ruling J4: "defo catalog's 134 bookkeeping rows removed"): the 101 monthly panel
# parents (an annual target never reads a monthly row: each parent is declared through its three aggregates,
# which carry the family's verdict, plan 1.4) and the 33 pre-lagged lag1_* columns of D:/defo_matrix (never
# read, ruling C). These are exactly the 134 rows defo_draft/catalog.yaml already left out. features/build_store.py
# takes the monthly parents from the declared aggregates (its column plan is unchanged: 101 monthly, 36 annual,
# 29 static).
# co_measured_with_target (plan 1.3: no default) is written only where the owner ruled it, true, so R8 floors each
# at one year: the 15 one-year-lag columns of ruling J4 (the aggregates of V13_mean_lst_C, nighttime_lst_C,
# cloud_frequency_pct and V20_burned_binary, and burn_month_count, burn_doy_mean, ntl), and the 6 aglw_* livestock
# columns of the AMENDED ruling J3 (the yearly AGLW series; its downscaling uses a year-matched optical land-cover
# mask, so without the fact R8 would give lag 0 and the trees would read same-year livestock; written in the same
# change as their watch verdict). 21 answers, all unverified. Owner ruling K4 (2026-10-06) adds 4: the land-cover columns
# modis_landcover_class, modis_landcover_annual, shrub_cover_pct_global and cropland_fraction, true, fact_status 'assumed'
# (set by the ruling, not signed): 25 answers. Every other kept time-varying column still needs an
# explicit answer before G-FACTS is built (OPEN, owner; review/proposed/BAN_REVIEW_SUMMARY.md 5 C proposes 'false').
#
# NOT listed (owner item): the target store's loss_px (numerator). It lives only in D:/defo_target, whose plan
# format holds unit id, group id, time and y (plan 1.2), so the target reader drops it.

columns:
  # ---- keys (never tree features, G-KEYS)
  cell_id: {role: key_unit}   # panel cell id ({group}_{ix}_{iy})
  region: {role: key_group}  # a panel column; the target and matrix files take it from the {group} placeholder
  year: {role: key_time, calendar_part: year}
  # ---- the one target (package facts, plan 1.3; timing facts unverified)
  loss_frac:
    role: target
    legal_range: [0, 1]
    legal_range_source: 'fraction by construction: loss_px / forest2000_px, with loss counted only inside the year-2000 forest mask (defo_ingest.py:6, 9, 14); Hansen GFC-2025-v1.13 lossyear'
    # window and stamp: the loss year, in the store catalogs' spelling (period_end + 1 year backward); the index
    # audit writes period_centre + 1 year centred (index_facts.yaml, proposed_status verified). Late-year losses can
    # be labelled the following year (a backward slip).
    window: {length: 1, unit: year, align: backward}
    stamp: period_end
    fact_status: unverified
    provenance: 'Hansen GFC-2025-v1.13 lossyear; loss_frac = pixels with lossyear == year-2000 over year-2000 forest pixels (treecover2000 >= 30 and land); defo_fetch.py:5-22, 41; defo_ingest.py:1-16 (index_facts.yaml). Version pinned (defo_fetch.py:21-22, 41).'
  # ---- report stratum (Q50: defo results by forest2000_px quartiles, owner 2026-09-27)
  forest2000_px: {role: report_stratum, provenance: 'target denominator, year-2000 forest pixels (defo_ingest.py:9); Q50 a quartiles (HEADLINE_QUESTIONS_AND_FIXES.md:51, 346-349); never a feature'}
