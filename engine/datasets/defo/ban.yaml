#   N  (owner ruling N, OWNER_RULINGS_2026-10-06.md): 404 since ruling N (S10: 10 rows removed, month and grace_lwe added;
#       S28 a: phenology_sos_doy conditional, phenology_sos_doy_lag2 keep, built by features/build.py like K5).
#   K6 (2026-10-06, agent C1, after ruling L1 b signed the 13 index windows {3, month, centred}): the 33 index aggregates
#       (soi, tna, tsa, iod, ao, nao, pna, wp, sam, noi, pdo: _mean/_min/_max) conditional -> keep. Built in the K store
