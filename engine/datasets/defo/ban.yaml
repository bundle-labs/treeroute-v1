# ban.yaml -- defo: the Q34 ban list, INSTALLED 2026-10-05 under owner ruling J (OWNER_RULINGS_2026-10-05.md:
# "yes install it for all 4 problems"). Source: engine/datasets/review/proposed/defo_ban_proposed.yaml (the agent's
# merged proposal; reasons and evidence per column in review/proposed/defo_columns_proposed.csv, overview in
# BAN_REVIEW_SUMMARY.md), with the owner's rulings applied in the same change:
#   J1  the proposal's defaults: lon/lat banned (structural); gdp_pc banned as a year clock (trend_proxy);
#       population_density kept, as ruled (Part 437; its year-clock numbers and 2021-23 extrapolation disclosed in
#       exceptions.yaml); every other ban as written.
#   J2 (a) the SPEI block and AMO (V06_spei_12m, spei_01m/03m/06m/24m, amo; 18 aggregates): the raw aggregates stay
#       banned (incomplete: their 2023 aggregate is empty) and each enters through ONE engineered lag column
#       <aggregate>_lag1 (the previous calendar year = the ruled 12 months), built by features/build.py: keep.
#   J2 (b) phenology_sos_doy: ban -> keep, one extra year: lag 1 year on this annual target, from the cautious bound
#       the panel store catalog now carries ({1, year, centred} + reach_after_max {1, year}, ASSUMED: the owner signs
#       it). deeprec_twsa is NOT moved: on defo it is banned for its lineage (target_derived: it assimilates LUH2 land
#       use), not for its undocumented window.
#   J2 (c) snow_duration_days: ban -> keep (an annual end-of-year total; R8 gives lag 0 on this annual target, D25 a).
#   J2 (d) the engine's 'last value' rule changes no verdict here (an annual step is longer than its 2-month reach);
#       eddi and aridity_index_p_pet stay banned. eddi_observed's annual aggregates stay KEEP as proposed (never
#       missing; no month key on an annual target): OWNER CHECK, J2 (d) lists eddi_observed among the long seasonal
#       masks that 'stay banned' on the monthly targets.
#   J3  (AMENDED by the owner 2026-10-05; it replaces the first J3 text, freeze) livestock aglw_* (6): ban -> watch.
#       The YEARLY AGLW series is a LAGGED annual driver: catalog.yaml declares it co_measured_with_target (its
#       downscaling uses a year-matched optical land-cover mask that encodes that year's forest loss), so R8 lags
#       it one year; watch because the 2022-23 values are the 2021 layer rescaled by India's FAOSTAT ratios in
#       every region (disclosed in exceptions.yaml, unsigned). No column is frozen.
#   J4  the 15 one-year-lag columns (the aggregates of V13_mean_lst_C, nighttime_lst_C, cloud_frequency_pct,
#       V20_burned_binary; burn_month_count, burn_doy_mean, ntl): conditional -> keep, in the same change that writes
#       their catalog fact co_measured_with_target: true (R8 floors them at one year); the 134 bookkeeping rows (101
#       monthly parents, 33 lag1_*) are gone from catalog.yaml, so this file has no entry for them.
#   J5  (engine, generic) R4 counts Y0 from the driver stores' first year: the features store starts in 2002 and the
#       largest kept lag is one year, so the ruling gives Y0 2003 here.
#   K  (owner ruling K, OWNER_RULINGS_2026-10-05.md, 2026-10-06: "yes apply it"), applied in the same change as the K
#       supplementary store D:/defo_features_k (features/build_store_k.py, catalog features/defo_features_k_store_catalog.yaml):
#       K1 spei_*/amo: already applied by J2 (a) above (the <aggregate>_lag1 columns, the previous year's aggregate; raw
#          parents banned 'incomplete'); nothing changes.
#       K2 epo_mean/_min/_max: ban incomplete -> keep. Built in the K store after the last-value fill; R8 lags them one
#          year (2026-10-06: the shared panel store catalog now carries epo's window {3, month, centred}, ruling L1 b,
#          merged by another task; the K store catalog regenerated, its facts 'assumed'), so the empty 2023 aggregate
#          (December 2023 is the record's tail, never filled) is read by no target year. Held conditional until then.
#       K3 deeprec_twsa: kept through deeprec_twsa_k3_mean/_min/_max (keep; the J2 b reach carried, R8 1 year); the
#          features store's deeprec_twsa_<stat> stay banned, reason target_derived -> lookahead_unfixable (their stored
#          facts carry no reach); lineage disclosed in exceptions.yaml.
#       K4 modis_landcover_class, modis_landcover_annual, shrub_cover_pct_global, cropland_fraction: ban post_event_state
#          -> keep, lagged one year through catalog.yaml co_measured_with_target: true (assumed).
#       K5 V15_bare_ground_pct_lag2, V17_herb_cover_pct_lag2, tree_cover_pct_lag2: keep (their own sum group
#          MOD44B_V15_V17_tree_cover_lag2, one verdict); the raw trio stays ban coproduct in MOD44B_V15_V17_tree_cover.
#          R4 counts the 2-year look-back (J5): Y0 2003 -> 2004 under derive_all.
#       K3/K5 columns are STORE columns: the G-LINEAGE stand-in (feature-script outputs only) never checks them; built
#          by features/build.py they would be refused (K5 G-LINEAGE: parents banned coproduct; K3 G-CLOSED). Disclosed
#          in exceptions.yaml; OWNER item closed (ruling N, 2026-10-06, OWNER_RULINGS_2026-10-06.md, FREEZE_SIGNOFF_SHEET.md S16 -- the engine checks store columns now; the K5 disclosure is signed under S8).
#       K6 every other verdict as installed.
#   L  (owner ruling L, OWNER_RULINGS_2026-10-05.md section L, "Yes to all"; the defo parts listed in
#       review/PENDING_DEFO_L.md, applied by the K task 2026-10-06):
#       L3 aglw_* (6): watch -> ban incomplete (L3 names post_window_snapshot; 'incomplete' because G-LINEAGE refuses a
#          feature-script output derived from a post_window_snapshot ban: OWNER item closed (ruling N, 2026-10-06, OWNER_RULINGS_2026-10-06.md, FREEZE_SIGNOFF_SHEET.md S13 -- incomplete confirmed the 2022-2023 layers are not observations, the record ends in 2021)); kept through the six
#          aglw_*_hold2021 columns (features/build.py: the real 2021 layer on the 2022-2023 rows): watch, R8 one year.
#       L4 eddi_observed_mean/_min/_max: keep -> ban structural, like eddi_observed itself (closes J2 d's OWNER CHECK).
#       L1 (signatures): NOT written here; this file and the package's facts carry no reviewed_by (OWNER item closed (ruling N, 2026-10-06, OWNER_RULINGS_2026-10-06.md, FREEZE_SIGNOFF_SHEET.md S18 -- defo is signed like the other packages (S1-S5))).
