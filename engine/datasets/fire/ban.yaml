# for all 4 problems"). One verdict per non-key column of catalog.yaml (closed world, plan 1.4): 204 verdicts (202 at the J install; ruling L added the six hold rows; ruling N S9 a removed the four lag-1 rings).
#
# SOURCE: engine/datasets/review/proposed/fire_ban_proposed.yaml (the agent's merged recommendation, adopted by J1 with
# the defaults of its 10 questions; per-row reasons, evidence and timing proposals: fire_columns_proposed.csv). Every
# verdict below is that file's, word for word, EXCEPT these rows, changed by the owner's later rules J2 and J3:
#   J3  (AMENDED by the owner 2026-10-05) aglw_cattle, aglw_buffalo, aglw_horse, aglw_sheep, aglw_goats,
#       aglw_total_lsu: ban -> WATCH. The yearly AGLW series kept as a lagged annual driver: R8 lags it 1 year on
#       this monthly target (no freeze, no R9; the first install's freeze is withdrawn). Post-2021 layers (the 2021
#       layer times India's FAOSTAT ratio, every region) are never read by fire (y_end 2022); exceptions.yaml.
#   J2a V06_spei_12m, spei_01m, spei_03m, spei_06m, spei_24m, amo stay banned (incomplete); six NEW rows <base>_lag12
#       (features/build.py) are keep.
#   J2b deeprec_twsa: ban -> keep (R8 lag 3 from the assumed store bound). phenology_sos_doy: ban -> keep (R8 lag 2
#       years from the assumed store bound; ATTENTION: R4 moves fire's Y0 from 2003 to 2004 because of it).
#   J2c snow_duration_days: ban -> keep (R8 lag 1 year).
#   J2d epo: ban -> conditional (SWITCH to keep once the pipeline runs fill_last_value before R30 AND its window
#       is signed: a signed window on a kept epo would let the December mask in with nothing refusing).
#       snow_cover_fraction: ban -> conditional (switch to keep once the engine runs its
#       last-value fill before R30; its store window is known, so it would enter now). Each conditional reason names
#       its switch.
# The three FireCCI burned-area columns keep the review's ban 'label'; catalog.yaml now gives them the role
# target_twin (review section 5 C), which forces that ban.
#
# THE HISTORY-STORE SWITCH (J1 / Q5: build fire's history store). The 9 fire-history columns below are 'conditional'
# until the every-unit store rebuilt at label lag 2 exists and dataset.yaml declares it (driver template + the include
# line printed by `ingest/build_history.py catalog`; dataset.yaml ATTENTION). Then switch each to the verdict its
# reason names:
#   tslf_months          -> watch
#   tslf_censored        -> watch
#   n_burns_12mo         -> keep
#   n_burns_60mo         -> watch
#   burn_rate_120mo      -> keep
#   nbr25km_12mo_lag3    -> keep
#   nbr75km_12mo_lag3    -> keep
#   nbr25km_12mo_lag6    -> keep
#   nbr75km_12mo_lag6    -> keep
# Until then a kept history column has no store facts and derive refuses it (R8), so 'conditional' is fail-safe.
#
# [SUPERSEDED by ruling L below: L1 signed the 13 index windows; nothing refuses at R8 now. Kept as J-era history.]
# TIMING FACTS ARE NOT SIGNED HERE (the owner signs them separately). Kept columns whose store window is still unknown
# with no signed bound make derive refuse at R8 (G-LAG), loudly, until the owner signs them: soi, tna, tsa, iod, noi,
# ao, nao, pna, wp, sam, pdo (review section 5 B) and grace_lwe (5 D). noi's J1 / Q2 bound ({3, month, centred}) is
# not written in the shared store catalog yet (its header: it goes in with the other index windows), so noi still
# refuses. epo's window is unsigned too, but epo is 'conditional', so R8 never sees it. No verdict here types a lag
# (there is no 'lag' verdict): R8 computes every lag from the facts. The bounds the rulings set (deeprec_twsa,
# phenology_sos_doy) are 'assumed' in the shared store catalog; aglw_* take the seeded {1, year, backward} window.
# J4: the 10 static soil rows keep the review's reasons word for word plus one J4 note (nitrogen_gkg is cg/kg).
# YEAR-CLOCK SCREEN (2026-10-05, the BAN_REVIEW_SUMMARY.md section 8 measure: fire groups with |r with the year|
# > 0.6, annual group means; a lag-12 column's 2003-2022 rows are its parent's 2002-2021): V06_spei_12m_lag12, spei_24m_lag12 move keep -> watch,
# as spi_12m and spi_24m (counts in each reason). The other lag-12 columns stay keep.
#
# Verdict words (plan 1.4): keep | keep_unreviewed | freeze | ban (reason: label, coproduct, target_derived,
# replaced_by_engine, post_event_state, lookahead_unfixable, trend_proxy, incomplete, structural,
# post_window_snapshot) | conditional | watch. keep, watch and freeze enter the trees (watch is also named in every
# report); ban and conditional leave every engine run.
