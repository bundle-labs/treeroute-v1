# Counts: keep 113, ban:incomplete 24, watch 14, ban:trend_proxy 13, ban:post_window_snapshot 10, ban:post_event_state 9, conditional 7, ban:structural 5, ban:target_derived 5, ban:label 4
#   (recounted 2026-10-06 after ruling N, OWNER_RULINGS_2026-10-06.md N: S9 a, S27, S29)
