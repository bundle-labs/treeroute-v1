  # ---- fire_history: ENGINEERED, target-derived (see the header)
  # RULED R-D (b), APPLIED 2026-09-29. Month t-1's label uses observations from month t, so the engine's own
  # history block (R17) starts at t-2, and no target-derived column may read a later label: the store is rebuilt
  # at newest label lag 2 (features/target_history.py NEWEST_LABEL_LAG = 1 + R17's start offset; every column at
  # month t reads labels of months <= t-2). The shipped store D:/fire/history reads label t-1 (Part 492) and must
  # not be read (the computed lag cannot show the leak: timing.lag_trace gives 0 for all 19, with or without the
  # 1-month reach carried to their windows, 2026-09-28). The rebuilt store holds 15 columns: the four lag-1
  # rings nbr*_lag1 read label t-1 and cannot be built, so they need a ban (the sheet bans the single-month two
  # already; nbr25km_12mo_lag1 and nbr75km_12mo_lag1 are shipped keeps). Its store catalog is generated by
  # ingest/build_history.py (ingest/fire_history_store_catalog.yaml; fire_draft includes it). The fire package
  # neither declares the shipped store nor includes its catalog (removed 2026-10-04: that catalog's 1-month
  # window leaves out the target's reach-after, so R8 would lag these columns 0 and nothing would refuse label
  # t-1); until the owner builds the every-unit store (dataset.yaml), these 19 rows have no store facts there and
  # derive refuses any one that is kept (R8).
  # Q34 (J1, Q5 default 'build fire's history store'): 9 of the 15 rebuildable columns wait as 'conditional' in
  # ban.yaml until the every-unit store is built and declared; each one's ban.yaml reason names the verdict it
  # switches to (ban.yaml header 'THE HISTORY-STORE SWITCH'). The other 10 rows stay banned (the four lag-1 rings
  # and the single-month lag-3/6 rings: target_derived; last_burn_size: a sparse own lag; last_burn_month: a month
  # key).
  # RING EDGES (disclosed for the Q34 G-HIST review; the shipped definition, fire_build_history.py:162-169): the
  # ring mean pads the region grid with scipy's 'nearest' mode, so for a unit on the grid's outermost row or column
  # its OWN cell is repeated inside its own ring. Its own value's weight in nbr* is (r+2)/(4(r+1)) at a corner and
  # r/((2r+1)^2-1) on an edge, 0 one cell in (r = ring radius in cells; over the 40 region grids r is 6-17 for
  # 25 km and 19-52 for 75 km: 25.5-28.6% at corners, 0.5-3.6% on edges; tests/test_fire_package.py). So the
  # eight lag-3/6 ring columns carry a partial own-history signal for edge units. It never reaches past the cut
  # (ring lag >= 3 > L = 2), and the G-HIST tests (exact equality) cannot see it. A pure neighbour aggregate (mode
  # 'constant', divided by the count of real neighbours) would change the shipped definition: owner's choice.
