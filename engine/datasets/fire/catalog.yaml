# catalog.yaml -- fire package facts (APP_PLAN.md 1.3). Drafted 2026-09-28 by the agent; unsigned.
# Every entry is a PACKAGE fact (plan 1.3): a role and, for the target, its window, stamp, legal range and
# error floor. Physical facts (dtype, units, cadence, windows, fills, lineage) live in the shared store catalogs
# included by dataset.yaml; a store fact written here is refused by the schema.
# fact_status is 'unverified' everywhere (the schema default where not written). Nothing here is signed.
# Column list: the rows of engine/datasets/review/v2/fire_columns.csv (the Q34 review sheet, 214 rows) except 18,
# plus the keys, plus the six lag-12 columns of owner rule J2 (a) (role engineered, built by features/build.py;
# end of this file). The 18 omitted rows are listed at the end of this header: the target store's 4 columns other
# than burned_frac, and the 8 fire_ndvi_lags and 6 fire_danger rows (stores dataset.yaml does not declare; ruling
# J1 / Q7 a: left undeclared). Roles come from the sheet's store class: store column -> driver, 'router_context'
# -> router_context, 'engineered' -> engineered; the three FireCCI burned-area columns are target_twin (below). A
# role is NOT a verdict: the verdicts are the owner's, in ban.yaml.
# Q34 INSTALLED 2026-10-05 (OWNER_RULINGS_2026-10-05.md section J): ban.yaml holds the review's verdicts
# (engine/datasets/review/proposed/fire_ban_proposed.yaml) with J2 and J3 applied (ban.yaml header lists each
# change). The package facts that installation writes here: the FireCCI trio's role target_twin (J1, review
# section 5 C), snow_cover_fraction's co-measured answer (J2 d), and the six J2 (a) lag-12 rows.
# co_measured_with_target has NO default (plan 1.3): it is written only where the owner has RULED it; every
# other candidate the sheet marks 'yes' still needs an explicit true/false with a Part number. NOT WRITTEN, owner
# item (G-FACTS, not built yet): the explicit 'false' on every other kept time-varying driver that the review
# proposes (fire_columns_proposed.csv, column timing_fact_proposal).
# NOT listed (owner items): the target store's other columns n_burned, n_valid, n_unmapped, unmapped_frac. The
# plan-format target table holds unit id, group id, time and y only (plan 1.2); validity (n_valid) belongs to the
# ingest. If the package reads D:/fire/target in place, each needs a role (support / report_stratum /
# target_twin) and a verdict, or the ingest drops them. Also not listed: the 14 rows of the two sidecar stores not
# declared in dataset.yaml (fire_ndvi_lags, fire_danger).
# fire_history columns are target-derived (their store facts say derived_from burned_frac, reads_target true):
# role ENGINEERED (plan 1.3: derived_from, operation and reads_target belong to engineered columns), not driver.
# Their values come from a fire-history store. features/target_history.py recomputes them from the target,
# strictly before each row: at the shipped label lag 1 it reproduces D:/fire/history value for value on every
# cell it holds (40 groups x its cells x 252 months, 2026-09-29; tests/test_fire_package_data.py); at the RULED
# label lag 2 (R-D b, see the fire_history block below) ingest/build_history.py writes the store (fire_draft
# declares it for the shipped pick; the fire package declares NO history store until the owner builds it for
# every unit, so a kept fire-history column has no store facts there and derive refuses it, R8).
# plan 3.2: tslf / n_burns / burn_rate / last_burn / nbr are checked against G-HIST in the Q34 review:
# none equals a column of the engine's own-history block or a plain lag on every row; last_burn_size equals
# y(t-L) wherever that lag is non-zero, a sparse own lag (tests/test_fire_package*.py; the draft bans it).
# The unit (key_unit cell_id) is the monthly panel's cell id; the target and both sidecars are keyed on lat + lon
# and are mapped to it by the package's key map (ingest/build_static.py writes the static table; the target
# reader and ingest/build_sidecars.py use it).

# 2026-10-06 (ruling L, OWNER_RULINGS_2026-10-05.md section L): six engineered rows <aglw_*>_hold2021 (L3: the real 2021
# livestock layer held for 2022-2023; features/build.py HOLD_PARENTS); cloud_frequency_pct's co_measured_with_target
# true is SIGNED (L1 c: fact_status assumed + reviewed_by owner + date, the schema's spelling of a signed fact).
columns:
  # ---- keys (never tree features, G-KEYS)
  cell_id: {role: key_unit}   # the panel cell id {group}_{ix}_{iy}; target and sidecars are keyed on lat+lon, mapped by the key map (ingest/build_static.py)
  region: {role: key_group}  # in cells_1000.parquet and the panel; the target files take it from the {group} placeholder
  year: {role: key_time, calendar_part: year}
  month: {role: key_time, calendar_part: month}
  # ---- the one target (package facts, plan 1.3; timing facts unverified)
  burned_frac:
    role: target
    legal_range: [0, 1]
    legal_range_source: 'fraction by construction: burned MODIS pixels / valid land pixels in the cell (fire_fetch_target.py:8, 339); MCD64A1.061 Burn_Date'
    # window and stamp: the burn DATES lie in one calendar month (store catalogs' spelling: period_end + 1 month
    # backward; the index audit writes period_centre + 1 month centred, the same month). RULED R-D (b)
    # (OWNER_RULINGS_2026-09-28.md B): add a reach-after fact, because month m's burned/unburned label normally uses
    # observations from month m+1 (MCD64 User Guide V6.1 3.1.2 [S34]; INDEX_WINDOW_AUDIT.md Table 3). The guide does
    # not state the margin (INDEX_WINDOW_AUDIT.md: "The margin is not stated"), so reach_after_max is a PROPOSED
    # BOUND of 1 month, chosen to fit the ruled consequence, not from evidence: the largest margin that keeps R17
    # starting fire's history block at t-2 as for NDVI (a new acceptance flag; expected_derived.json R17
    # start_offset_steps becomes 1). Any margin from 1 day to 1 month gives the same t-2; 2 months would give t-3.
    # A smaller margin that can be documented is preferred. The ruling fixed the fact, not this value, so
    # fact_status stays unverified until the owner signs the bound as 'assumed' (by Sat 10 Oct).
    # The bound MOVES the nowcast reference: reference_day(NOWCAST) is the end of the target's content, reach
    # included, so for month t it is the end of month t+1. On its own that reference would admit month t+1
    # content (lag_trace on this target: oni 2, tni 2, nino* 1, sst_anom_* 1, co2 0, V11/V12 0, against the
    # issue-step reference's 3, 3, 2, 2, 1, 1). The ruled lags hold only because R8 takes the larger of the two
    # references (D24), and the issue-step reference is the month end; a larger bound moves the nowcast
    # reference later still. Any later caller that reads the nowcast reference alone (an as-of join, a direct
    # G-LAG check) must not. tests/test_catalog_timing_facts.py pins nowcast < issue-step here.
    window: {length: 1, unit: month, align: backward, reach_after_max: {value: 1, unit: month}}
    stamp: period_end
    fact_status: unverified
    provenance: 'MCD64A1.061 monthly Burn_Date; burned_frac = pixels with Burn_Date > 0 / valid land pixels; ingest fire_fetch_target.py:1-13, 114-125, 159-161, 226-228, 339 (index_facts.yaml). Validity n_valid > 0 lives in the ingest (fire_architecture.py:273-274): ingest/target_reader.py writes NaN where n_valid <= 0 and for every unit-month the store does not hold (a complete census), and maps lat/lon to cell_id through the key map (ingest/build_static.py).'
