# catalog.yaml -- PM2.5 package facts (APP_PLAN.md 1.3). Drafted 2026-09-28 by the agent; unsigned.
# Every entry is a PACKAGE fact (plan 1.3): a role and, for the target, its window, stamp, legal range and
# error floor. Physical facts (dtype, units, cadence, windows, fills, lineage) live in the shared store catalogs
# included by dataset.yaml; a store fact written here is refused by the schema.
# fact_status is 'unverified' everywhere (the schema default where not written). Nothing here is signed.
# Column list: every row of engine/datasets/review/v2/pm25_columns.csv (the Q34 review sheet) plus the keys, with
# the role taken from the sheet's store class: store column -> driver, 'router_context' -> router_context,
# 'engineered' -> engineered; plus (2026-10-05, ruling J2 a) the six lag-12 engineered columns of the feature
# script, which are not sheet rows. A role is NOT a verdict: the verdicts are the owner's, in ban.yaml (installed
# 2026-10-05 under ruling J).
# co_measured_with_target has NO default (plan 1.3): it is written only where the owner has RULED it; every
# other candidate the sheet marks 'yes' still needs an explicit true/false with a Part number.

# 2026-10-06 (ruling L3, OWNER_RULINGS_2026-10-05.md section L): six engineered rows <aglw_*>_hold2021 (the real 2021
# livestock layer held for 2022-2023; features/build.py HOLD_PARENTS). No package fact here is signed (PM2.5 has no
# co_measured 'true' answer for L1 c to sign).
columns:
  # ---- keys (never tree features, G-KEYS)
  cell_id: {role: key_unit}   # e.g. alaska_interior_taiga_-4175_2275 ({group}_{ix}_{iy}, plan 1.2)
  region: {role: key_group}  # a panel column; the target files take it from the {group} placeholder
  year: {role: key_time, calendar_part: year}
  month: {role: key_time, calendar_part: month}
  # ---- the one target (package facts, plan 1.3; timing facts unverified)
  pm25_ugm3:
    role: target
    # legal_range: seeded [0, inf) from review/v2/pm25_columns.csv (a concentration is non-negative). NOT a cited
    # product range: the sheet says the range "must cite the ACAG V5.GL.06 documentation", and no such citation is
    # in the repo. legal_range_source is therefore left EMPTY on purpose (G-FACTS will refuse it until the owner
    # cites the ACAG documentation). Owner item.
    legal_range: [0, .inf]
    # window and stamp: one calendar month. Written in the store catalogs' spelling (period_end + 1 month
    # backward); the index audit writes the same month as period_centre + 1 month centred
    # (engine/datasets/_stores/index_facts.yaml, proposed_package_target_facts.pm25, proposed_status verified).
    window: {length: 1, unit: month, align: backward}
    stamp: period_end
    measurement_error_floor: 2.0   # ug m-3: ACAG's own absolute error floor (pm25_adaptation.py:144 HIT_TOL; ruling A11). Printed beside the hit rate, never used to select.
    fact_status: unverified
    legal_range_source: 'physical bound: PM2.5 is a mass concentration (ug m-3), never negative; no upper bound is set. The ACAG V5.GL.06 documentation is not in the repository; the owner may add its citation here | cited by the owner 2026-10-06 (ruling N, OWNER_RULINGS_2026-10-06.md, FREEZE_SIGNOFF_SHEET.md S7)'
    provenance: 'ACAG V5.GL.06 HybridPM25 Global monthly, mean of the pixels inside each cell; ingest acag_pm25_ingest.py (index_facts.yaml); fill 9.96921e36 -> NaN in the ingest (plan 3.2); unknown: whether the monthly GWR calibration pools monitors across months (index audit owner item 7)'
