# Ready to copy over engine/datasets/pm25/ban.yaml ONLY after the owner approves it; nothing in the package
# was changed. Row-by-row reasons, timing-fact proposals and questions: pm25_columns_proposed.csv (same folder).
#
# Closed world (plan 1.4, G-CLOSED): one verdict per non-key column of datasets/pm25/catalog.yaml (178: the
# 166 panel columns, GFED burn_frac / burn_npix, the engineered burn_lag1, 6 EDGAR columns, ctx:month, ctx:lat
# and the target). Schema: treeroute/package/schema.py BanFile / Verdict (validated in a scratch copy under
# D:/treeroute/ban_review/). For a ban, 'reason' is the ban-reason word and 'evidence' starts with the plain
# reason; for every other verdict 'reason' is the plain reason. There is no 'lag' verdict: a shipped 'lagged'
# column is 'keep' and R8 computes its lag from the signed timing facts.
#
# Owner rulings applied, not re-decided: A1 (annual columns lagged, by R8), A2 (9 optical + 8 MODIS land-cover
# columns conditional), A3 (14 FREEZE columns banned), A4 (EDGAR conditional add-on), A5 (AMO dropped), Q2
