# SKEPTIC-PASS MERGE 2026-10-05 (BAN_REVIEW_SUMMARY.md): deeprec_twsa watch -> ban lookahead_unfixable (its LSTM input
# window is undocumented); epo watch -> ban structural (December gap = month key); store facts to fix before signing:
# nitrogen_gkg units/range and V30_soil_moisture_pct lower bound (D95 would refuse the run); burn_frac lag 1 by a
