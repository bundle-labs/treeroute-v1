# 2026-10-05 from engine/datasets/review/v2/defo_columns.csv and merged with the skeptic pass the same day; per-column
# reasons and evidence in review/proposed/defo_columns_proposed.csv; overview in BAN_REVIEW_SUMMARY.md. Nothing here is
# a ruling until the owner approves it. Schema: treeroute/package/schema.py BanFile (validated in a scratch copy under
# D:/treeroute/ban_review/merge_2026-10-05/).
#
# ADOPT IN ONE CHANGE WITH THE CATALOG CLEANUP (packaging option b, skeptic pass): this file has NO entries for the 101
# monthly parents and the 33 lag1_* columns. First drop those 134 rows from datasets/defo/catalog.yaml (exactly the
# rows datasets/defo_draft/catalog.yaml already leaves out), then copy this file over ban.yaml. Against today's
# catalog the closed-world check refuses loudly (134 columns without a verdict); nothing can leak that way.
# Closed world after the cleanup: one verdict per non-key column (381), checked with treeroute.io.apply.apply_verdicts.
#
# How to read it:
#  - A review-sheet row's verdict is the family verdict; the annual aggregates <parent>_mean/_min/_max carry it
#    (APP_PLAN.md:172 family expansion; the engine applies verdicts per column).
#  - There is no 'lag' verdict. The shipped 'lagged' columns are 'keep' where a store fact gives their lag
#    (V11_mean_ndvi, V12_mean_evi, V14_mean_albedo, gpp_kgC_m2: reach facts -> lag 1 year).
#  - CONDITIONAL (fail-safe, skeptic pass): (a) the 15 entries of V13_mean_lst_C, nighttime_lst_C,
#    cloud_frequency_pct, V20_burned_binary (_mean/_min/_max) and burn_month_count, burn_doy_mean, ntl are safe only
#    at lag 1 year, which only co_measured_with_target: true in catalog.yaml gives (evidence Part 431,
#    defo_ban.py:116-137). Write that fact and switch them to keep IN THE SAME CHANGE; G-FACTS is not built, so a
#    'keep' without the fact would enter at lag 0 silently. (b) the 33 aggregates of soi, pdo, tna, tsa, iod, noi,
#    ao, nao, pna, wp, sam are not built: sign their windows in the panel store catalog, rebuild with
#    features/build_store.py, update the include sha256, then switch them to keep.
#  - Every other kept time-varying column needs an explicit co_measured_with_target: false in catalog.yaml before
#    G-FACTS is built (plan 1.3: no default).
