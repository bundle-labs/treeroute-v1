# ndvi_ban_proposed.yaml -- PROPOSAL, NOT SIGNED. The agent's Q34 recommendations for the NDVI package
# (owner request, not quoted: the agent makes the ban list with its recommendations; written 2026-10-05).
# Ready to copy over engine/datasets/ndvi/ban.yaml ONLY after the owner approves it; nothing in the package
# was changed. Row-by-row reasons, timing-fact proposals and questions: ndvi_columns_proposed.csv (same folder).
#
# Closed world (plan 1.4, G-CLOSED): one verdict per non-key column of datasets/ndvi/catalog.yaml (206 = every row of
# review/v2/ndvi_columns.csv: the target V11 and the 165 other panel columns, GFED burn_frac / burn_npix, 28 engineered
# water-memory columns, 10 router-context columns). Schema: treeroute/package/schema.py BanFile / Verdict, validated in a scratch
# copy under D:/treeroute/ban_review/ndvi/ (load_package + io.apply_verdicts against the catalog roles).
# For a ban, 'reason' is the ban-reason word and 'evidence' starts with the plain reason; for every other verdict
# 'reason' is the plain reason. There is no 'lag' verdict: a shipped 'lagged' column is 'keep' and R8 computes its
# lag from the signed timing facts.
#
# The 435 driver lags declared by features/build.py are NOT listed here: catalog.yaml has no rows for them yet
# (dataset.yaml OPEN item). When their rows are added, each <base>_lag<k> takes its base column's verdict (plan 1.4
# family expansion). Bases banned for a leak reason (trend_proxy: co2, the 6 food prices, scpdsi,
# sst_anom_mediterranean; lookahead_unfixable: deeprec_twsa) must leave features/build.py LAG_BASES, or the engine
# refuses their 50 lag outputs (treeroute/pipeline/data.py:224-227). epo, eddi, aridity_index_p_pet (structural) and
# esacci_sm (incomplete) do not trip that check, but their lags are banned with them: drop them from LAG_BASES too.
#
# Owner rulings applied, not re-decided: Q1 a / F16 (V11 label, V12 twin), Q35 a (clf_dry/clf_wet), Q38 b (GFED burn
# at lag 1), Q2 + R-A / R-B (oni, tni, nino*, sst_anom_* kept and lagged), Q3 a / A1 / A3 / A5 (annual columns lagged,
# FREEZE banned, snow-DOY banned, AMO and SPEI dropped for 2023), Q33 (engineered features kept), F3 (MOD44B trio as
# shipped), Q34 (ban lists per problem). Open questions: BAN_REVIEW_SUMMARY.md (Q2, Q3, Q4, Q6, Q8, Q9 touch NDVI).
# SKEPTIC-PASS MERGE 2026-10-05 (BAN_REVIEW_SUMMARY.md): snow_cover_fraction -> ban incomplete (October 2022 empty
# in all 133 regions); epo -> ban structural (December gap = month key); deeprec_twsa -> ban lookahead_unfixable;
# gdp_pc and population_density -> ban trend_proxy (year clocks, Q4); noi conservative 3-month bound (lag 1, Q2);
# 'Q3 a / A1' citation corrected on the annual rows.
