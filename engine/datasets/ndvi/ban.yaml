# ban.yaml -- ndvi: the owner's Q34 ban list, INSTALLED 2026-10-05 under OWNER_RULINGS_2026-10-05.md section J
# (owner: "yes install it for all 4 problems"). Written by the agent; the owner's signature on the timing facts is
# separate and NOT given here (see 'STILL TO SIGN' below).
#
# Base (J1): engine/datasets/review/proposed/ndvi_ban_proposed.yaml (the merged first pass + skeptic pass), with the
# defaults of BAN_REVIEW_SUMMARY.md's questions (Q3 deeprec replaced by J2 b; Q4 a: gdp_pc and population_density
# banned as year clocks; Q8: sst_anom_mediterranean banned; Q9: the top-5 router helpers disclosed). Row-by-row
# reasons, evidence and timing proposals: review/proposed/ndvi_columns_proposed.csv.
# Changes on top of the base, each written into the entry's evidence:
#   J2 (a) V06_spei_12m, spei_01m/03m/06m/24m, amo: the raw columns stay banned (incomplete); each is kept through
#          one dataset-owned engineered lag-12 column <base>_lag12 (features/build.py LAG12_BASES), verdict keep.
#   J2 (b) deeprec_twsa: keep with its 5 lags, at the lag-3 bound the shared store catalog now carries (reach_after_max
#          {3, month}, fact_status assumed, merged 2026-10-05 by the PM2.5 ban-list task): R8 lag 3.
#          phenology_sos_doy stays banned as a co-product.
#   J2 (c) snow_duration_days: keep (R8 lags it one year).
#   J2 (d) epo: keep (December takes November by the engine's last-value rule; window still unsigned -> G-LAG);
#          snow_cover_fraction: watch at lag 1 (catalog.yaml co_measured_with_target true), its empty October 2022
#          filled by the last-value rule.
#   J3     (AS AMENDED by the owner, 2026-10-05) aglw_* (livestock, the yearly AGLW series): watch, kept and lagged;
#          R8 lags it one year on this monthly target, so it carries only last year's mask. Not banned, not frozen.
#          Its 2022-23 rows are the 2021 layer rescaled by India's FAOSTAT ratios (every region): disclosed in
#          exceptions.yaml. (The first J3 text, an NDVI ban as a co-product, is replaced.)
#   J4     features/build.py drops the 18 banned lag bases (DROPPED_LAG_BASES); LAG_BASES keeps 69 of run89's 87.
#   cloud_frequency_pct: catalog.yaml co_measured_with_target true (Q3 a, as the base's reason says: lag 1).
#
# Closed world (plan 1.4, G-CLOSED): one verdict per non-key column of catalog.yaml: the 206 review-sheet columns,
# then the feature script's 351 lag rows (345 driver lags + 6 lag-12 columns). The engine has no verdict family
# expansion, so each <base>_lag<k> carries its own entry, and it takes its base's verdict (plan 1.4 family).
# For a ban, 'reason' is the ban-reason word; otherwise 'reason' is the plain reason. There is no 'lag' verdict:
# R8 computes every lag from the timing facts.
#
# STILL TO SIGN (timing facts; nothing here marks a fact verified or signed):
#   - windows of the 13 kept or watched columns the store catalog declares unknown (R8 refuses them at lag 0, G-LAG,
#     until signed): soi, tna, tsa, iod, noi (bound ruled by J1, the Q2 default {3, month, centred}: assumed; not
#     yet merged into the shared store catalog, so still refused), ao, nao, pna, wp, sam, epo, pdo
#     (+ reach 2 months, R-A a), grace_lwe (+ 15-day reach either side, assumed) -- and so their 65 lags;
#   - the J-merged store facts, all fact_status assumed: deeprec_twsa's lag-3 bound (J2 b), burn_frac's 1-month reach
#     (J1, Q1 default), nitrogen_gkg's cg/kg units and V30_soil_moisture_pct's legal minimum (J4);
#   - co_measured_with_target on cloud_frequency_pct and snow_cover_fraction (written true from Q3 a / J2 d, row
#     fact_status unverified), and an explicit true/false for every other kept time-varying driver (G-FACTS);
#   - the ruled facts already merged (the index windows of R-A a, R-B, R-C a; the target window of item 8 a);
#   - aglw_*'s store facts behind its one-year lag (the seed's cadence {1, year} and window {1, year, backward},
#     fact_status unverified), and the snow_cover_fraction choice the owner still has to make (exceptions.yaml:
#     its polar-night gaps are longer than the last-value maximum and fall to R30's zero-fill).
# Recounted 2026-10-06 after ruling N (OWNER_RULINGS_2026-10-06.md N): S11 removed the sheet row ctx:climatology
#   (205 of the 206 sheet columns have a verdict), S29 banned road_density.
# Verdict counts (206 sheet columns): keep 138, ban:incomplete 16, ban:coproduct 13, ban:trend_proxy 11, ban:post_window_snapshot 9, ban:structural 9, watch 6, ban:target_derived 2, ban:label 1
# Verdict counts (all 562 entries): keep 464, watch 37, ban:incomplete 16, ban:coproduct 13, ban:trend_proxy 11, ban:post_window_snapshot 9, ban:structural 9, ban:target_derived 2, ban:label 1
# REVISED 2026-10-06 under ruling L (OWNER_RULINGS_2026-10-05.md section L, owner: "Yes to all"). SUPERSEDES the lines
# above where they differ (the J-era notes stay as history):
#   L1     TIMING FACTS SIGNED by the owner (2026-10-06): the 13 index windows soi, tna, tsa, iod, ao, nao, pna, wp, sam,
#          noi, pdo, epo, grace_lwe are {3, month, centred} in the shared panel store catalog (R8: lag 1 month;
#          ruling N1, OWNER_RULINGS_2026-10-06.md N, then gave pdo nino34's form + the ERSSTv5 reach: lag 2); the
#          facts the install marked 'assumed' (deeprec_twsa reach, phenology_sos_doy window, burn_frac reach,
#          nitrogen_gkg units/range, V30 minimum, tni) and the aglw_* yearly facts are signed; written fact_status
#          'assumed' + reviewed_by owner + date 2026-10-06 (the schema has no 'signed' value). Nothing is refused at
#          R8 any more (G-LAG passes on the catalog facts).
#   L3     LIVESTOCK 2022-23: aglw_cattle, aglw_buffalo, aglw_horse, aglw_sheep, aglw_goats, aglw_total_lsu: watch -> BAN;
#          six NEW rows <parent>_hold2021 (features/build.py HOLD_PARENTS: the real 2021 layer held for 2022-2023,
#          backward only, declared) are WATCH, lagged one year by R8; the hold is disclosed in their reason.
#          REASON WORD (owner check) closed (ruling N, 2026-10-06, OWNER_RULINGS_2026-10-06.md, FREEZE_SIGNOFF_SHEET.md S13 -- incomplete confirmed the 2022-2023 layers are not observations, the record ends in 2021): L3 says the raw aglw_* are banned 'post_window_snapshot for 2022+'. They are
#          written ban 'incomplete' (as J2 a's raw parents): the engine's lineage stand-in refuses EVERY feature built
#          from a column banned for post_window_snapshot (treeroute/pipeline/data.py LINEAGE_LEAK_REASONS,
#          check_feature_lineage, G-LINEAGE), so the literal word would refuse the six hold columns L3 asks for. To
#          use the literal word, the engine must first learn that a hold column never reads the banned rows.
#   L2     phenology_sos_doy stays banned as a co-product (no change).
#   L4     epo stays keep (window now signed: lag 1, and its 5 lags follow from the composed facts).
#   L1 c   the catalog.yaml co_measured_with_target 'true' rows cloud_frequency_pct, snow_cover_fraction and burn_frac
#          are signed (fact_status assumed, reviewed_by owner, date 2026-10-06).
