# catalog.yaml -- NDVI package facts (APP_PLAN.md 1.3). Drafted 2026-09-28 by the agent; unsigned.
# Every entry is a PACKAGE fact (plan 1.3): a role and, for the target, its window, stamp, legal range and
# error floor. Physical facts (dtype, units, cadence, windows, fills, lineage) live in the shared store catalogs
# included by dataset.yaml; a store fact written here is refused by the schema.
# fact_status is 'unverified' everywhere (the schema default where not written). Nothing here is signed.
# Column list: every row of engine/datasets/review/v2/ndvi_columns.csv (the Q34 review sheet) plus the keys, with
# the role taken from the sheet's store class: store column -> driver, 'router_context' -> router_context,
# 'engineered' -> engineered. A role is NOT a verdict: the verdicts are the owner's, in ban.yaml.
# co_measured_with_target has NO default (plan 1.3): it is written only where the owner has RULED it; every
# other candidate the sheet marks 'yes' still needs an explicit true/false with a Part number.
# FEATURE-SCRIPT ROWS (added 2026-10-05 with the J ban list, OWNER_RULINGS_2026-10-05.md J1/J2 a/J4): the lag
# columns features/build.py declares (345 driver lags <base>_lag<k> of its 69 LAG_BASES, run89's 87 minus the 18
# banned bases, and the 6 J2 (a) lag-12 columns of LAG12_BASES) are listed at the END, role engineered. Their
# store facts come from the feature script (composed from their source's, so R8 lags them); the engine has no
# verdict family expansion, so each needs its own row here and its own verdict in ban.yaml (G-CLOSED). The 28
# water-memory rows and the router-context rows below are the review sheet's. This catalog is no longer the sheet's
# rows only: tests/test_packages_declarative.py CATALOG_NOT_ON_SHEET (outside this package) still pins it there.
# co_measured_with_target, J-ruled (2026-10-05, unsigned): cloud_frequency_pct (Q3 a / J1) and snow_cover_fraction
# (J2 d) true, beside burn_frac (Q38 b).
# The top-5 router-context columns carry data_selected (plan 1.3): they were chosen from 89 helper forests, 19 of
# which are NDVI TEST groups (F15), on rows up to 2019-12, after the earliest fit cut (NDVI's inner-fit end is
# 2016) -> test-exposed on both of plan 1.3's grounds, disclosed in exceptions.yaml. The group list is written once
# (YAML anchor &run89_helpers) and reused by the other four entries. 'plan 3.3 flag 8' below is the plan's
# statement that the list stays as shipped (a 3.3 flag, not an owner ruling).

# 2026-10-06 (ruling L, OWNER_RULINGS_2026-10-05.md section L): six engineered rows <aglw_*>_hold2021 (L3: the real 2021
# livestock layer held for 2022-2023; features/build.py HOLD_PARENTS); the co_measured_with_target true answers of
# cloud_frequency_pct, snow_cover_fraction and burn_frac are SIGNED (L1 c: fact_status assumed + reviewed_by owner +
# date, the schema's spelling of a signed fact).
columns:
  # ---- keys (never tree features, G-KEYS)
  cell_id: {role: key_unit}   # panel cell id ({group}_{ix}_{iy})
  region: {role: key_group}
  year: {role: key_time, calendar_part: year}
  month: {role: key_time, calendar_part: month}
  # ---- the one target (package facts, plan 1.3; timing facts unverified)
  V11_mean_ndvi:
    role: target
    legal_range: [-0.2, 1.0]
    legal_range_source: 'MOD13 User Guide V6.1 Table 19: valid_range -2000..10000, scale 0.0001 (index_facts.yaml proposed_package_target_facts.ndvi; ingest presplit_cc/ingest_modis_cmg_local.py:59; plan 1.3)'
    # window and stamp: RULED form (OWNER_RULINGS_2026-09-28.md B item 8 (a) and C 'Reach across a step edge'): one
    # calendar month centred PLUS the reach facts of MOD13C2's overlap-weighted 16-day composites, up to 15 days past
    # the month end and 15 days before its start (INDEX_WINDOW_AUDIT.md T9, [S38, S42]; index_facts.yaml
    # proposed_package_target_facts.ndvi). reach_after_max is the MAXIMUM over the months (September 15 days,
    # October 15 in leap years); December reaches 2-3 days into January (the day-353 composite, [S42]; plan 3.2
    # 'about 3 days'), which the 15-day bound covers. Same facts as the panel store column V11_mean_ndvi.
    # Consequences: R17 starts the history block one step back (t-2 at the nowcast; expected_derived.json R17
    # start_offset_steps 1); R8 is unchanged for whole-month drivers (D24 takes the issue-step reference too).
    # fact_status stays unverified (the owner signs timing facts by Sat 10 Oct).
    window: {length: 1, unit: month, align: centred, reach_after_max: {value: 15, unit: day}, reach_before_max: {value: 15, unit: day}}
    stamp: period_centre
    measurement_error_floor: 0.02   # rule R1 (HEADLINE_QUESTIONS_AND_FIXES.md:26, 482: NDVI keeps +-0.02). Printed beside the hit rate, never used to select.
    fact_status: unverified
    provenance: 'panel column V11_mean_ndvi (MOD13C2.061 CMG 0.05 deg monthly NDVI, scale 1e-4; presplit_cc/ingest_modis_cmg_local.py:59); the target by ruling Q1 a (HEADLINE_QUESTIONS_AND_FIXES.md:62)'
