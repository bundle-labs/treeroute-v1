  - kind: disclosed_defect
    column: 'snow_cover_fraction'
    decision: 'disclose; kept (watch) at lag 1 as same-sensor co-measured, its short gaps filled by the engine''s last-value rule (owner ruling J2 d); the polar-night gaps below are kept with this disclosure (owner ruling N S15: watch)'
    reason: 'Two kinds of gap. (1) MOD10CM October 2022 is absent: snow_cover_fraction is 100% missing in that month in all 133 regions (measured by the NDVI skeptic, 2026-10-05). It is a one-month gap INSIDE the record, so under J2 (d) the November 2022 rows (lag 1) read the unit''s most recent EARLIER value (September), not R30''s zero-fill (''no snow''). (2) Polar night: the earlier text said it blanks only December in two groups, filled from November. That is WRONG for five groups, where the winter gap is mostly longer than the 2-month maximum. Measured 2026-10-05 on D:/monthly_panel (read-only; the engine''s own io.lastvalue.fill_last_value run on the lag-1 column; labelled rows = V11_mean_ndvi present, 2003-2023; agent measurement, not signed). Per group: cells with at least one winter gap longer than the 2-month maximum / gap lengths in months (median, 90th percentile, longest) / labelled rows reading a missing lag-1 value before -> after the fill (test years 2020-23 after the fill): taimyr_peninsula 99.8% / 3, 4, 6 / 13.8% -> 13.4% (14.3%); finnish_lapland 97.5% / 2, 3, 5 / 14.7% -> 6.7% (8.5%); alaska_north_slope 99.6% / 3, 3, 5 / 12.0% -> 7.2% (9.8%); yamal_peninsula 98.6% / 2, 3, 23 / 13.9% -> 6.4% (6.7%); canadian_arctic_nunavut 87.2% / 2, 3, 7 / 16.3% -> 4.4% (6.6%); alaska_interior_taiga 3.4% / 1, 1, 5 / 9.8% -> 0.06% (0.17%: its one-month December gap IS filled). The other 127 groups were not measured. Under the rule''s per-gap reading (io/lastvalue.py) a gap longer than 2 months is left WHOLE to R30, which zero-fills it (''no snow''): mostly the February and March rows, the first labelled months after polar night. That is the seasonal-mask pattern J2 (d) keeps banned for eddi, eddi_observed and aridity_index (3-5 winter months); the owner''s J2 (d) decision on this column was made on the October-2022 premise; ruling N S15 then kept it as watch knowing these polar-night gaps (no leak either way). The fill reads later PRESENCE, never a later value: October 2022 is filled because November 2022 holds a value; a real-time November 2022 issue would not know that, and its row would be a ''tail'' left to R30 (presence-only reading signed by the owner in ruling L1 d and disclosed, io/lastvalue.py). Re-ingesting MOD10CM 2022-10 would remove the October fill.'
    owner: 'owner -- signed by the owner 2026-10-06 (ruling N, OWNER_RULINGS_2026-10-06.md, FREEZE_SIGNOFF_SHEET.md S8); basis: ruling J2 (d) (OWNER_RULINGS_2026-10-05.md), ruling L1 d and ruling N S15 (watch, disclosed); refreshed 2026-10-06 for ruling N S8 (OWNER_RULINGS_2026-10-06.md), not yet read by the owner'
    date: '2026-10-06'
  - kind: disclosed_defect
    column: 'epo'
    decision: 'disclose; kept, December filled from November by the engine''s last-value rule (owner ruling J2 d); window {3, month, centred} signed by ruling L1 b, so R8 lags it 1 month'
    reason: 'CPC never issues a December East Pacific Oscillation value (22 of the panel''s 264 months; INDEX_WINDOW_AUDIT.md:75). Under J2 (d) December takes November''s value (the most recent earlier value, 1 month back, counted per column), so R30''s zero-fill no longer marks December exactly (the month-key mechanism behind the J1 base''s structural ban). Its five lags carry the same fill one to twelve months later. Its window {3, month, centred} was signed by the owner (ruling L1 b), so R8 lags it 1 month. The fill never reads a later VALUE (io/lastvalue.py re-checks every fill: same unit, strictly earlier step, at most 2 steps back), but it reads later PRESENCE: a December is filled only because the January after it holds a value. In this backtest every December is filled; a real-time issue in December would not yet know January, and its row would be a ''tail'' left to R30. This presence-only reading was signed by the owner (ruling L1 d) and is disclosed (io/lastvalue.py module docstring).'
    owner: 'owner -- signed by the owner 2026-10-06 (ruling N, OWNER_RULINGS_2026-10-06.md, FREEZE_SIGNOFF_SHEET.md S8); basis: ruling J2 (d) (OWNER_RULINGS_2026-10-05.md: ''Fixes epo (December takes November)''), rulings L1 b and L1 d; refreshed 2026-10-06 for ruling N S8 (OWNER_RULINGS_2026-10-06.md), not yet read by the owner'
    date: '2026-10-06'
  - kind: provenance_flag
    column: 'luh2_urban'
