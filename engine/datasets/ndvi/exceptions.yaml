    reason: 'PSL amon.us.data ("AMO unsmoothed, short") is detrended over its WHOLE record [S10], so every stored value depends on SST months after the row, up to the end of the record (January 2023): a whole-record dependency, disclosed like a base period (Q43 a), as INDEX_WINDOW_AUDIT.md row 9 asks (datasets/_stores/INDEX_WINDOW_AUDIT.md:56; source S10, https://psl.noaa.gov/data/timeseries/AMO/). The lag of 12 months does not remove it: the detrending is fixed when the series is published, not when the month is observed.'
