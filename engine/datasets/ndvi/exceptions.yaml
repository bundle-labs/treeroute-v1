    owner: 'owner -- signed by the owner 2026-10-06 (ruling N, OWNER_RULINGS_2026-10-06.md, FREEZE_SIGNOFF_SHEET.md S8); basis: ruling J1 (OWNER_RULINGS_2026-10-05.md; the J1 base discloses it under Q4)'
