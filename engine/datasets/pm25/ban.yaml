# it for all 4 problems"), REVISED the same day for the AMENDED J3 and the review of the first install.
# Source: engine/datasets/review/proposed/pm25_ban_proposed.yaml (the Q34 review with the defaults of its 10 questions,
# ruling J1), with the owner's rules applied:
#   J2 (a) spei_01m, spei_03m, spei_06m, V06_spei_12m, spei_24m, amo: the raw parents stay banned 'incomplete'; each is
#          kept through an engineered <parent>_lag12 column (features/build.py; catalog.yaml role engineered).
#   J2 (b) deeprec_twsa kept (watch) at an assumed lag-3 store bound. phenology_sos_doy kept (watch) at the assumed
#          one-extra-year bound: lag 2 years, so R4 moves Y0 from 2003 to 2004 (this column alone sets it). OWNER
#          decision settled (ruling N, 2026-10-06, OWNER_RULINGS_2026-10-06.md, FREEZE_SIGNOFF_SHEET.md S14 -- ruled by L2 phenology_sos_doy is conditional and Y0 stays 2003): keep (Y0 2004), conditional or ban (Y0 2003, ruling F3); expected_derived.json provisional.
#   J2 (c) snow_duration_days kept (R8 lags it one year).
#   J2 (d) epo KEPT: the engine's last-value rule is wired (treeroute/pipeline/data.py:53 and :724-728 call
#          io/lastvalue.fill_last_value), so each December takes the same unit's November value. Its store window is
#          still unknown, so G-LAG refuses it with the 11 other kept index columns until the owner signs one
#          (proposed {1, month, centred}, like nao/pna/wp). December 2023 is a tail, left to R30 (disclosed).
#          [SUPERSEDED by L1 b below: window signed {3, month, centred}, lag 1 month; no row reads December 2023.]
#   J3     AMENDED: aglw_* (6) are 'watch', a lagged annual driver (R8: year-1; no freeze, no R9). Listed because the
#          2022-23 layers are the 2021 layer times INDIA's FAOSTAT ratios, applied to every region, and the 2023 test
#          rows read the 2022 layer (exceptions.yaml disclosed_defect; the data fix is an owner decision).
#   J4     nitrogen_gkg units/range and V30_soil_moisture_pct legal minimum: store facts, marked assumed.
#   J1     burn_frac lag 1 (GFED store reach, assumed). noi's J1 bound is NOT written to the store yet: G-LAG refuses
#          it LOUDLY with the 11 other kept index columns whose windows were settled by the owner (ruling N, 2026-10-06, OWNER_RULINGS_2026-10-06.md, FREEZE_SIGNOFF_SHEET.md S14 -- signed by L1 (b) the 13 index windows are 3, month, centred), while an unwritten
#          burn_frac reach would let it in at lag 0, silently (the panel store header says why both are as they are).
# The verdicts are the owner's by ruling J, except three agent choices that were settled by the owner (ruling N, 2026-10-06, OWNER_RULINGS_2026-10-06.md, FREEZE_SIGNOFF_SHEET.md S14 -- watch confirmed for deeprec_twsa and spei_24m_lag12; phenology_sos_doy is conditional by L2): phenology_sos_doy,
# deeprec_twsa and spei_24m_lag12 'watch' rather than 'keep'. The TIMING FACTS behind the lags are NOT signed: every
# store fact this change wrote is fact_status 'assumed'; the owner signs them separately. The aglw_* store facts are
# the seed's again (unverified, no content_epoch): the amended J3 needs none of its own.
#
# Closed world (plan 1.4, G-CLOSED): one verdict per non-key column of catalog.yaml (184: the 166 panel columns, GFED
# burn_frac / burn_npix, the engineered burn_lag1 and the 6 lag-12 columns, 6 EDGAR columns, ctx:month, ctx:lat and the
# target). Schema: treeroute/package/schema.py BanFile / Verdict. For a ban, 'reason' is the ban-reason word and
# 'evidence' starts with the plain reason; for every other verdict 'reason' is the plain reason. There is no 'lag'
# verdict: a 'lagged' column is 'keep' and R8 computes its lag from the timing facts.
# REVISED 2026-10-06 under ruling L (OWNER_RULINGS_2026-10-05.md section L, owner: "Yes to all"). SUPERSEDES the lines
# above where they differ (the J-era notes stay as history):
#   L1     TIMING FACTS SIGNED by the owner (2026-10-06): the 13 index windows soi, tna, tsa, iod, ao, nao, pna, wp, sam,
#          noi, pdo, epo, grace_lwe are {3, month, centred} in the shared panel store catalog (R8: lag 1 month;
#          ruling N1, OWNER_RULINGS_2026-10-06.md N, then gave pdo nino34's form + the ERSSTv5 reach: lag 2); the
#          facts the install marked 'assumed' (deeprec_twsa reach, phenology_sos_doy window, burn_frac reach,
#          nitrogen_gkg units/range, V30 minimum, tni) and the aglw_* yearly facts are signed; written fact_status
#          'assumed' + reviewed_by owner + date 2026-10-06 (the schema has no 'signed' value). Nothing is refused at
#          R8 any more (G-LAG passes on the catalog facts).
#   L3     LIVESTOCK 2022-23: aglw_cattle, aglw_buffalo, aglw_horse, aglw_sheep, aglw_goats, aglw_total_lsu: watch -> BAN;
#          six NEW rows <parent>_hold2021 (features/build.py HOLD_PARENTS: the real 2021 layer held for 2022-2023,
#          backward only, declared) are WATCH, lagged one year by R8; the hold is disclosed in their reason.
#          REASON WORD (owner check) closed (ruling N, 2026-10-06, OWNER_RULINGS_2026-10-06.md, FREEZE_SIGNOFF_SHEET.md S13 -- incomplete confirmed the 2022-2023 layers are not observations, the record ends in 2021): L3 says the raw aglw_* are banned 'post_window_snapshot for 2022+'. They are
#          written ban 'incomplete' (as J2 a's raw parents): the engine's lineage stand-in refuses EVERY feature built
#          from a column banned for post_window_snapshot (treeroute/pipeline/data.py LINEAGE_LEAK_REASONS,
#          check_feature_lineage, G-LINEAGE), so the literal word would refuse the six hold columns L3 asks for. To
#          use the literal word, the engine must first learn that a hold column never reads the banned rows.
#   L2     phenology_sos_doy: watch -> CONDITIONAL (out), so Y0 stays 2003 (its 2-year lag set Y0 2004 alone).
#   L4     epo stays keep (now with its signed window: lag 1 month, so the 2023-12 row reads November 2023 and no
