# legacy_harness/shipped_splits.yaml -- the shipped HARD donor/test splits of the four headline packages.
#
# Moved here on 2026-09-28 (night) from datasets/<package>/split.yaml by owner rulings E, L7 (b): under
# leave-one-region-out (owner ruling D) split.yaml holds only excluded and seen_during_design, and every
# group in the data is trained and tested. The old lists are kept, exactly, for two uses only:
#   - the legacy harness (APP_PLAN.md 4.4) rebuilds each shipped hand split from them to replay the shipped
#     runs (it holds the exact shipped lists instead of inferring the donors);
#   - treeroute_report/continuity_groups.yaml reports the old TEST groups alone, from the same LORO run
#     (the continuity row, R34, 7.1); it must equal test_groups below (tests/test_packages_declarative.py).
# The engine never reads this file (G-IMPORT, G-NONAMES); it may name problems and regions. Nothing here
# changes a fit, a pick or a decision.
#
# Each package block keeps, verbatim, the provenance comments its split.yaml carried (the '|' lines), then
# the lists as they stood. Written by a one-off generator from those files, so no list was re-typed.
# tests/test_packages_declarative.py re-checks every list as a SET against its shipped source (skipped
# where the source is not on the machine; a failure if the source's sha256 changed).

