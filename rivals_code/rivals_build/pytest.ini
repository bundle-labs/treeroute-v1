[pytest]
# Run from D:\treeroute\rivals_build:
#   py -3.9 -m pytest rivals/tests --basetemp D:\treeroute\rivals_build\pt\<key>\<fresh name>
# The parent folder of --basetemp must exist. Use a FRESH name each run: pytest empties an existing basetemp.
# Real-data tests (SPEC_RIVALS.md 4.3 smoke export, 4.4 coral dry pass) run only with RIVALS_REAL=1.
# Heavy synthetic tests (the RF RAM check at the NDVI shape) run only with RIVALS_HEAVY=1.
testpaths = rivals/tests
python_files = test_*.py
addopts = -p no:cacheprovider -ra
markers =
    realdata: reads a real run or package (read-only); runs only with RIVALS_REAL=1
    heavy: synthetic data at the production shape (~1 GB file, ~2.5 GiB RAM); runs only with RIVALS_HEAVY=1
