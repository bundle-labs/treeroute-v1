# PRODUCTION config of the common-rival board (owner commands only; RIVALS_OWNER_COMMANDS.md).
# Every path absolute. Pass it to EVERY command with --config (the CLI refuses without --config).
# machine_file is the ENGINE's own machine file, so the heavy-job lock (in its temp_dir D:/treeroute/tmp) is the
# engine's lock: a rival job and an engine run can never run at the same time (robustness review 2).
engine_root: 'C:/Users/<user>/Desktop/data set for reserch paper/engine'
machine_file: 'C:/Users/<user>/Desktop/data set for reserch paper/engine/config/machine.yaml'
export_root: 'D:/treeroute/rival_export'
export_ckpt_root: 'D:/treeroute/rival_export/_engine_run_root'
out_root: 'D:/treeroute/rivals'
moved_root: 'D:/treeroute/rivals/_moved'
# the fit-set copies (rebuildable caches, several GB on NDVI and defo) go here, outside the board folders, so
# the owner can delete them after a lead is scored (rivals.log prints 'may delete' lines with their size)
scratch_root: 'D:/treeroute/rivals_scratch'
# the no-op proof chain of the older-engine grid runs (ndvi, fire, defo); pm25's run has no full chain: see below
engine_lineage: 'D:/treeroute/rivals_build/engine_lineage.json'

# ACCEPTED ENGINE DIFFERENCES (owner rulings; DATA, one entry per RUN ID; rivals/export.py acceptance_for).
# An entry lets I4 use the listed engine hops (no parsable no-op proof; each pinned by the sha256 of its evidence
# files) and lets I5 pass the listed run-config keys at EXACTLY the listed run and LIVE values. Any other
# difference still refuses. The export then REQUIRES every parity check P1-P15 to pass (P15: the engine's own bank
# fit on the exported rows reproduces the run's recorded bank fingerprints); otherwise it refuses and the owner is
# asked. Recorded in each lead's export_manifest.json (engine.accepted_difference) and on the board.
accepted_engine_differences:
  - run_id: '20261007_74e67609'
