    ruling: 'Z1'
    ruling_source: 'OWNER_RULINGS_2026-10-06.md section Z (Z1, owner 2026-10-21: the pm25 headline is not re-run)'
    # the acceptance holds for this LIVE engine only (930d961c); a new LIVE needs its own proof or ruling
    live_engine_file_sha: '930d961cdfdd219c36b113174e6c865096f973068e30696850f13d5ec4a60814'
    requires_parity: 'P1-P15'
    note: >-
      The run was made under engine 7b508557. Its hops to 65a177bc have no proof file with LIVE/BUILD sha lines,
      so I4 finds no chain; 65a177bc -> dd7c0984 -> 930d961c is proven in engine_lineage.json. The engine
      constants table gained 11 run-mechanics constants since (P6 checkpoints x6, P7 room/reader x5; none changed
      or removed), so I5 finds the config key engine_constants_sha256 different. Wording map (Z check, 2026-10-21):
      ruling Z1's text names I5 as "per_group_schedule reader_builds 24 vs 16"; in the export, I5's refusal is the
