[pytest]
# Skeptic review tests of the human-rival tool (leakage and fairness). Run from D:\treeroute\human_rivals_build\human:
#   set PYTHONDONTWRITEBYTECODE=1
#   py -3.9 -B -m pytest -c ..\review_tests\pytest.ini ..\review_tests --basetemp D:\treeroute\human_rivals_build\pt\review\<fresh>
# Tests marked xfail(strict=True, raises=AssertionError) PIN AN OPEN ISSUE: they fail on the safe behaviour today.
# When the issue is fixed they XPASS, which strict mode turns into a failure: then remove the marker.
python_files = test_*.py
addopts = -p no:cacheprovider -ra
xfail_strict = true
markers =
    realdata: reads a real run, export or product (read-only); runs only with HUMAN_REAL=1
    runjson: reads only plan.json / derived.json / test key columns of a real headline run (light; always runs)
    flow: drives a toy flow of the human tool
    slow_ok: a slower toy (still under a minute)
