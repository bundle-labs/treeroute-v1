               Part 501 (XGB-Tweedie ML rival, old split); fire_danger and fire_danger_local (rivals.py, 15-24 Sep
               2026, D:/adaptation/_rivals/fire_L*.npz: our own Fosberg/FFDI-style index, L0 MAE 0.006715, R2
               +0.0408, old split). Also known when Part B was planned (2026-10-21) and specified (2026-10-25): our
               fire headline test scores (Part 590) and the fire common board (Part 606: timid Tweedie and
