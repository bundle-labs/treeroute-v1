    coverage: x_finite
    coverage_note: "rows whose unit maps to a valid 1-deg land point of its box and whose target month has >= 80%
                    finite member-days (25 members x days of the month)"
    disclosures:
      - "re-forecasts (25 members) for starts to 2016-12, real-time forecasts (51 members, members 0-24 kept) from
         2017-01: part of train, all of test (HQ11); re-forecasts start from a different analysis"
      - "start = 00 UTC on the 1st of month t-5 = the end of the issue month (Q16); released about the 5th, as our ERA5
         inputs appear about 5 days after the month: data-time parity"
      - "daily leads 150-184 always contain the whole target month (its first day is lead 150-153, its last 180-183;
         computed for every start month 2015-2020, leap Feb included); days of the window outside the target month are
