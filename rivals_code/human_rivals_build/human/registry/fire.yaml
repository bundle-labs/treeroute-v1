      variable: fwinx
      start_months_before_target: 5      # start = 00 UTC on the 1st of month t-5 = the end of the issue month (Q16)
      lead_days: [150, 184]              # leadtime_hour 12 + 24 k, k = 150..184 (FP:81, :218-222)
      members: [0, 24]                   # members 0-24 in every year (RF:39; FP:225-228)
      unit_centres: {product: fire_static_cells, file: part-0.parquet, id: cell_id, lat: lat, lon: lon}
