      - "no lead 12: GEFF-SEAS5 runs 216 days"
      - "x__fwi_pct = the unit's mid-rank percentile among its own same-calendar-month FWI of target months up to the
         lead's guard cut (lead 0: 2003-2015; lead 6: 2003-01..2015-07; training years), the row's own month left out,
         so every row (pick, refit and test rows alike) is ranked out of sample against FWI known before the guard cut"
      - "F6 = normal x per-group isotonic ratio on the stat (identity link only), fitted as research C-A states: on fit
         rows the normal is the same per unit-month mean with the row's own year left out, and the isotonic ratio is
         fitted with weights N^2 (= squared error on the burned fraction, PLAN rule 5); predictions use the run's own
         normal of the scored rows"
      - "the L1 line of an F6 pick is the L1 isotonic anomaly map of the same stat (maps.fit_l1 has no F6 form,
         maps.py:433-443); printed only"
      # OD-12. Spec 2.5 wrote "86% of test rows"; the measured count (spec facts list) is 86,388 of 96,000 = 90%
      - "normal-anchored F6 predicts 0 where the unit's training normal is 0 (90% of lead-6 test rows: 86,388 of 96,000)"
    r10_note: "non-blind: Part 491 (our own danger indices MDC, KBDI, Fosberg; old 30/10 split); Parts 496-498 (CEMS
               GEFF-SEAS5 FWI against the OLD model, northern_australia_monsoon 2021-22, leads 0-1 month, link fitted on
               2019+ rows inside today's test window 2019-22, where the FWI-only map lost to predict-zero, MAE 0.0254
               vs 0.0192, and the box-matched anomaly R2 was -0.089; the statistic fwi_mean and the C-B per-group
