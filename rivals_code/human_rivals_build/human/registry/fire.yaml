# Runner rivals (SPEC_HUMAN_PARTB 2.4; code by builder B2: adapters/fire_enso.py, adapters/fire_turco.py). M kind, no
# adapter / stats / families; one configuration each (the form is an OWNER DECISION, ruled before F7; never a pick).
#
# Cut-off rule (OD-4.2): the runners' lead-6 rows are {tier: P} as below. Only if D3 misses 18 Nov AND OD-4.2 = (a),
# both runners' lead-6 rows become
#     6: {tier: X, label: "labelled extension: the primary lead-6 rival F-SEAS5 is pending (D3 not complete by 18 Nov, Q24)"}
# together with the leads_without_rival[6] line above, written before F7 (B9). Under OD-4.2 = (b) the tiers stay P and
# each runner's disclosures gain "lead 6: optional rivals only; the primary F-SEAS5 is pending (D3 not complete by
# 18 Nov, Q24)". Whether the runners stay P is otherwise OD-13.
  - id: enso_lag
    label: "ENSO-lag regression (Chen et al. 2011, 2016; our implementation): the region's fire anomaly on the lagged ONI"
    kind: M
    runner: adapters.fire_enso
    products: []
    t1_kind_columns: [oni]               # R8 steps 3 -> T1 boundary issue - 3; x__oni IS ONI(issue - 3) (facts above)
    reads_target_in_test_window: false
    leads:
      0: {tier: none, reason: "a seasonal method; at the nowcast the observed-weather FWI (geff_era5) is the rival"}
      6: {tier: P}
      12: {tier: X, label: "labelled statistical extension: beyond the published lead of ENSO fire-season forecasts"}
                                                                               # OWNER DECISION OD-3 (X recommended)
    score_without_net: []
    pick: lowest_covered_lead_guard      # one configuration; "pick" only names the guard lead (6)
    slim_extra_columns: [x__oni]
    optional: true                       # Q17 (PLAN :279)
    resolution_matched: false
    coverage: all_rows                   # label-free: every test row is predicted (a missing ONI -> the normal, counted)
    coverage_note: "label-free: every row (a missing or out-of-range ONI predicts the normal, counted)"
    disclosures:
      - "our implementation of a published method class (Chen et al. 2011 Science 334:787; 2016 Nat. Clim. Change
         6:906); not an operational product"
      - "ONI is the engine's own lagged column x__oni = ONI of issue - 3 (catalogue rule; owner 2026-09-27: lagged, not
         dropped); a subset of our model's inputs"
      - "one slope per region, fitted on the region's training rows to the lead's cut; a missing ONI predicts the normal"
      - "lead 12 is beyond the published lead (labelled extension, never decides)"        # OD-3 = X
    r10_note: "non-blind: Part 491 (our own danger indices MDC, KBDI, Fosberg; old 30/10 split); Parts 496-498 (CEMS
               GEFF-SEAS5 FWI against the OLD model, northern_australia_monsoon 2021-22, leads 0-1 month, link fitted on
               2019+ rows inside today's test window 2019-22, where the FWI-only map lost to predict-zero, MAE 0.0254
               vs 0.0192, and the box-matched anomaly R2 was -0.089; the statistic fwi_mean and the C-B per-group
               isotonic form were chosen after them, and the normal-anchored C-A / F6 form and the per-unit percentile
               x__fwi_pct were designed on 2026-10-21 with them in view - no score of F6 or x__fwi_pct itself exists);
               Part 501 (XGB-Tweedie ML rival, old split); fire_danger and fire_danger_local (rivals.py, 15-24 Sep
               2026, D:/adaptation/_rivals/fire_L*.npz: our own Fosberg/FFDI-style index, L0 MAE 0.006715, R2
               +0.0408, old split). Also known when Part B was planned (2026-10-21) and specified (2026-10-25): our
               fire headline test scores (Part 590) and the fire common board (Part 606: timid Tweedie and
               predict-zero win on MAE). The form (RF:49) was written before any score of it, normal-anchored like
               C-A in the same note (see geff_era5); ONI was a feature of every old fire model"
    options:
      form: E1                           # E1 | E2 | E3 (OWNER DECISION OD-2; section 4.1; E1 RECOMMENDED)
      index_column: x__oni
      index_abs_max: 5.0                 # |ONI| > 5 -> missing (counted)
      min_fit_rows: 100                  # per group (Q2.HQ9 row floor)
      fire_season_months: 3              # E2 only
      min_month_rows: 100                # E3 only

  - id: turco_spi
    label: "SPI-lag climate-fire model (Turco et al. 2018; our implementation): fire anomaly on observed SPI at the issue month"
    kind: M
    runner: adapters.fire_turco
    products: []
    t1_kind_columns: [spi_01m, spi_03m, spi_06m, spi_12m, spi_24m]           # R8 steps 0 -> boundary = issue
    reads_target_in_test_window: false
    leads:
      0: {tier: none, reason: "a seasonal method; at the nowcast the observed-weather FWI (geff_era5) is the rival"}
      6: {tier: P}
      12: {tier: X, label: "labelled statistical extension: beyond the published lead of the SPI fire forecasts"}
                                                                               # OWNER DECISION OD-3 (X recommended)
    score_without_net: []
    pick: lowest_covered_lead_guard
    slim_extra_columns: [x__spi_01m, x__spi_03m, x__spi_06m, x__spi_12m, x__spi_24m]
    optional: true                       # Q20 (a) "a second optional beside ENSO-lag" (PLAN :281)
    resolution_matched: false
    coverage: all_rows
    coverage_note: "label-free: every row (a missing or out-of-range SPI predicts the normal, counted)"
    disclosures:
      - "our implementation of Turco et al. 2018 (Nat. Commun. 9:2718): only OBSERVED SPI at the issue month; the
         paper's seasonal-forecast SPI of the fire season is not used (no SEAS5 precipitation: D5 not approved, Q10)"
      - "SPI scale and slope chosen per region on its training rows only (form OWNER DECISION OD-1)"
      - "a missing or out-of-range SPI predicts the normal (counted; rule of Part A AG3 for H1)"
      - "lead 12 is beyond the published lead (labelled extension, never decides)"        # OD-3 = X
    r10_note: "non-blind: Part 491 (our own danger indices MDC, KBDI, Fosberg; old 30/10 split); Parts 496-498 (CEMS
               GEFF-SEAS5 FWI against the OLD model, northern_australia_monsoon 2021-22, leads 0-1 month, link fitted on
               2019+ rows inside today's test window 2019-22, where the FWI-only map lost to predict-zero, MAE 0.0254
               vs 0.0192, and the box-matched anomaly R2 was -0.089; the statistic fwi_mean and the C-B per-group
               isotonic form were chosen after them, and the normal-anchored C-A / F6 form and the per-unit percentile
               x__fwi_pct were designed on 2026-10-21 with them in view - no score of F6 or x__fwi_pct itself exists);
               Part 501 (XGB-Tweedie ML rival, old split); fire_danger and fire_danger_local (rivals.py, 15-24 Sep
               2026, D:/adaptation/_rivals/fire_L*.npz: our own Fosberg/FFDI-style index, L0 MAE 0.006715, R2
               +0.0408, old split). Also known when Part B was planned (2026-10-21) and specified (2026-10-25): our
               fire headline test scores (Part 590) and the fire common board (Part 606: timid Tweedie and
               predict-zero win on MAE). Never run before; normal-anchored like C-A (see geff_era5); the SPI columns
               were features of the old fire models"
