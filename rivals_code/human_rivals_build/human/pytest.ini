[pytest]
# The human-rival tool's toy tests (SPEC_HUMAN.txt section 7). Run from D:\treeroute\human_rivals_build\human:
#   set PYTHONDONTWRITEBYTECODE=1
#   py -3.9 -B -m pytest rivals_human/tests --basetemp D:\treeroute\human_rivals_build\pt\<key>\<fresh name>
# The parent folder of --basetemp must exist and the name must be FRESH (pytest empties an existing basetemp).
# Without --basetemp, conftest.py picks D:\treeroute\human_rivals_build\pt\tests\auto_<utc stamp>.
# Real-data tests run only with HUMAN_REAL=1 (owner commands, one heavy job at a time).
testpaths = rivals_human/tests
python_files = test_*.py
addopts = -p no:cacheprovider -ra
markers =
    realdata: reads a real run, export or product (read-only); runs only with HUMAN_REAL=1
    flow: drives a full toy flow of the human tool (slim, adapt, check, init, tune, lock, refit, refs, score, board)
    slow_ok: a slower toy (still under a minute), e.g. the Kraft LSTM CPU fit
