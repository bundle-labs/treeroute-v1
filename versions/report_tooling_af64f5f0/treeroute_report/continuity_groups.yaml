# treeroute_report/continuity_groups.yaml -- the continuity row of each headline package's report.
#
# Owner ruling D (2026-09-28 night): "the old hard-split test groups are also reported alone, from the same
# run". Owner rulings E, L7 (b): the list lives here and in legacy_harness/shipped_splits.yaml, not in the
# package, so split.yaml holds only excluded and seen_during_design and a new problem needs no such list.
# treeroute_report computes this row from SAVED rows with the signed report/metrics.py (the same functions
# as the headline, over these groups only), labelled 'continuity, not a replication'; the band is derived
# on all groups and judges this row too (R35). Reporting only: it never changes a fit, a pick or a
# decision, and the engine never reads this file.
#
# continuity_groups = the old test_groups of legacy_harness/shipped_splits.yaml, exactly (checked by
# tests/test_packages_declarative.py). old_test_units is the old test-unit total printed beside the LORO
# total (plan 3.2, 7.2); the LORO scored units per group come from the run (C16, K = 20).

