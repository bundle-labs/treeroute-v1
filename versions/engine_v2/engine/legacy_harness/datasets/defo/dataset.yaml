# dataset.yaml -- the deforestation (annual forest-loss fraction) dataset package (APP_PLAN.md 1.1-1.2). Drafted
# 2026-09-28; rewired 2026-09-29 for owner ruling C 'Defo store' (option b); unsigned. Name, version, owner,
# description, store path templates, includes. Nothing else.
#
# Stores are READ IN PLACE (plan 1.2), never copied.
#   target   D:/defo_target: cell_id, year, loss_px, forest2000_px, land_px, loss_frac (parquet footer, 2026-09-28),
#            read through ingest/target_reader.py (loss_frac only; NaN without year-2000 forest, D30). The group
#            comes from the {group} placeholder.
#   drivers  RULED (OWNER_RULINGS_2026-09-28.md C): "Rebuild defo's yearly columns from the monthly panel with the
#            package's feature script (aggregate_time). Do not read D:/defo_matrix's target copy, train/test flag or
#            pre-lagged columns." So:
#            1. the FEATURES store D:/defo_features/{group}_{year}.parquet, written by features/build_store.py from
#               the monthly panel and the target store (one file per group and panel year, one row per target
#               cell): the aggregate_time columns <parent>_mean/_min/_max of the monthly drivers, the annual and
#               static drivers as they are, and the four target-derived h_* columns. It is listed FIRST, so the
#               engine reads every kept column from it (the reader takes each column from the first store that
#               holds it). Its facts: features/defo_features_store_catalog.yaml (generated) for the aggregates and
#               h_*, the panel catalog for the annual and static columns (the same columns).
#            2. the monthly PANEL, the features store's source (read by features/build_store.py and
#               ingest/build_static.py). The engine reads no column from it for this package: an annual target
#               cannot take a monthly store's 12 rows per (unit, year), and every kept column is in store 1.
#            D:/defo_matrix is no longer declared: nothing reads it.
#   features the features output (plan 1.1 'features output'; the same template as driver store 1).
#   static   D:/defo_features/static/part-0.parquet, written once by ingest/build_static.py: cell_id, region, lat,
#            lon, grid_ix, grid_iy and forest2000_px (the Q50 report stratum; static by construction).
# BUILT by the owner (commands: engine/datasets/defo/features/build_store.py docstring), 2026-09-29 17:46 to
# 2026-09-30 00:45: the static table and 924 group-year files (42 groups x 2002-2023, 5.9 GB). Checked
# 2026-10-04, read-only: every file is kept by build_store.py's resume rule today (same content digest through
# the pinned predecessor, store catalog, aggregate code, target sha256, panel size and mtime, file size), and
# every store year's aggregate facts are covered by the catalog entry. A missing file stops a run at the driver
# read (G-MISSING), loudly.
#
# 2026-10-05 (owner ruling K, OWNER_RULINGS_2026-10-05.md, 2026-10-06 "yes apply it"): a SECOND driver store, the
# small K supplementary store D:/defo_features_k/{group}_{year}.parquet (one file per group and panel year, one row per
# target cell, the features store's rows), written by features/build_store_k.py from the monthly panel so the
# 6.3-hour features store is not rebuilt: K2 epo_mean/_min/_max (after the last-value fill), K3
# deeprec_twsa_k3_mean/_min/_max (the J2 b reach carried) and K5 V15_bare_ground_pct_lag2, V17_herb_cover_pct_lag2,
# tree_cover_pct_lag2 (year t-2). No column is in both stores. Its facts: features/defo_features_k_store_catalog.yaml
# (generated), included by sha256. NOT BUILT IN FULL by the agent: the owner runs 'build_store_k.py build ..'
# (command, time and disk in the K report); until every group is built a run on a group without K files stops at
# the driver read (G-MISSING), loudly.
# includes: the panel store catalog (the source store's facts, and the annual / static columns' facts) and the
# generated features store catalog, each by sha256. ../_stores/defo_annual_features_schema_catalog.yaml, the
# catalogs task's seed of the aggregate facts (no window), is NOT included: the generated catalog supersedes it
# and is cross-checked against it on every typed fact when it is written.
name: defo
version: '0.2.0'
owner: 'UNSIGNED -- the project owner fills in the name'
description: 'Annual Hansen GFC forest-loss fraction on the 4 km panel cells of 42 forested regions; drivers rebuilt from the monthly panel by the package feature script (ruling C); declarative package, every fact unverified, or assumed where an owner ruling sets it (nothing signed)'
stores:
  target: 'D:/defo_target/{group}.parquet'
  static: 'D:/defo_features/static/part-0.parquet'
  drivers:
    - 'D:/defo_features/{group}_{year}.parquet'
    - 'D:/defo_features_k/{group}_{year}.parquet'
    - 'D:/monthly_panel/{group}_monthly_{year}.parquet'
  features: 'D:/defo_features/{group}_{year}.parquet'
